<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life OS</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life OS">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
html,body{margin:0}
.login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:var(--bg,#F2F2F7);background-image:radial-gradient(60vw 60vw at 85% -10%,rgba(0,122,255,.10),transparent 60%),radial-gradient(50vw 50vw at -10% 40%,rgba(88,86,214,.07),transparent 60%)}
.login-card{width:min(380px,100%);display:flex;flex-direction:column;gap:16px;padding:32px;border-radius:28px;background:var(--glass-card,rgba(255,255,255,.6));-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border:.5px solid var(--glass-edge,rgba(255,255,255,.75));box-shadow:0 12px 40px rgba(31,38,64,.08)}
.login-card h1{font-size:28px;line-height:34px;margin:0}
.login-card .brand{padding:0;justify-content:flex-start}
.login-msg{margin:0;color:var(--muted,#6e6e73);font-size:14px;line-height:20px}
.login-card .btn{justify-content:center}
</style>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/shim.js"></script>
</head>
<body>
<style>
/* Layout: realaize UI Framework (HIG für Web). Seitenleiste 240px aus Sekundär-Glas, ab <1024px nur Symbole (68px), unter 768px Tab-Leiste unten. Inhalt auf secondarySystemBackground, Karten als Primär-Oberfläche mit 16px Radius, Segmente für Reiter. Signatur: Tagesringe auf „Heute“. */
:root{
  /* System-Farben (Framework 2.1) */
  --blue:#007AFF; --green:#34C759; --indigo:#5856D6; --orange:#FF9500; --pink:#FF2D55; --purple:#AF52DE; --red:#FF3B30; --teal:#5AC8FA; --yellow:#FFCC00;
  /* Rollen */
  --bg:#F2F2F7; --surface:rgba(255,255,255,.80); --surface-solid:#FFFFFF; --side:rgba(246,246,246,.85); --elev:rgba(255,255,255,.92);
  --fg:#000000; --muted:rgba(60,60,67,.75); --faint:rgba(60,60,67,.30); --quat:rgba(60,60,67,.18);
  --fill:rgba(118,118,128,.12); --fill2:rgba(120,120,128,.16); --fill4:rgba(116,116,128,.08);
  --sep:rgba(60,60,67,.29); --sep-soft:rgba(60,60,67,.12); --hair:rgba(0,0,0,.10);
  --accent:#007AFF; --accent-btn:#0071E3; --accent-text:#0062CC; --accent-soft:rgba(0,122,255,.12); --on-accent:#FFFFFF; --accent2:#5856D6;
  --good:#1F7A36; --warn:#C93400; --bad:#D70015; --good-soft:rgba(52,199,89,.12); --warn-soft:rgba(255,149,0,.12); --bad-soft:rgba(255,59,48,.10);
  --ring1:#007AFF; --ring2:#5856D6; --ring3:#FF2D55;
  --sh1:0 1px 3px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.04); --sh2:0 4px 16px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.06); --sh3:0 24px 80px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --r:16px; --r-btn:12px; --r-in:10px; --r-badge:6px;
  --fs:15px; --fs-sub:13px; --fs-foot:12px; --row:44px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --blue:#0A84FF; --green:#30D158; --indigo:#5E5CE6; --orange:#FF9F0A; --pink:#FF375F; --red:#FF453A;
  --bg:#000000; --surface:rgba(28,28,30,.80); --surface-solid:#1C1C1E; --side:rgba(28,28,30,.85); --elev:rgba(44,44,46,.92);
  --fg:#FFFFFF; --muted:rgba(235,235,245,.60); --faint:rgba(235,235,245,.30); --quat:rgba(235,235,245,.18);
  --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.32); --fill4:rgba(116,116,128,.18);
  --sep:rgba(84,84,88,.65); --sep-soft:rgba(84,84,88,.35); --hair:rgba(255,255,255,.10);
  --accent:#0A84FF; --accent-btn:#0071E3; --accent-text:#409CFF; --accent-soft:rgba(10,132,255,.18); --accent2:#5E5CE6;
  --good:#30D158; --warn:#FF9F0A; --bad:#FF453A; --good-soft:rgba(48,209,88,.16); --warn-soft:rgba(255,159,10,.16); --bad-soft:rgba(255,69,58,.16);
  --ring1:#0A84FF; --ring2:#5E5CE6; --ring3:#FF375F;
  --sh1:0 0 0 .5px rgba(255,255,255,.08); --sh2:0 4px 16px rgba(0,0,0,.4),0 0 0 .5px rgba(255,255,255,.08); --sh3:0 24px 80px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.1);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --blue:#0A84FF; --green:#30D158; --indigo:#5E5CE6; --orange:#FF9F0A; --pink:#FF375F; --red:#FF453A;
  --bg:#000000; --surface:rgba(28,28,30,.80); --surface-solid:#1C1C1E; --side:rgba(28,28,30,.85); --elev:rgba(44,44,46,.92);
  --fg:#FFFFFF; --muted:rgba(235,235,245,.60); --faint:rgba(235,235,245,.30); --quat:rgba(235,235,245,.18);
  --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.32); --fill4:rgba(116,116,128,.18);
  --sep:rgba(84,84,88,.65); --sep-soft:rgba(84,84,88,.35); --hair:rgba(255,255,255,.10);
  --accent:#0A84FF; --accent-btn:#0071E3; --accent-text:#409CFF; --accent-soft:rgba(10,132,255,.18); --accent2:#5E5CE6;
  --good:#30D158; --warn:#FF9F0A; --bad:#FF453A; --good-soft:rgba(48,209,88,.16); --warn-soft:rgba(255,159,10,.16); --bad-soft:rgba(255,69,58,.16);
  --ring1:#0A84FF; --ring2:#5E5CE6; --ring3:#FF375F;
  --sh1:0 0 0 .5px rgba(255,255,255,.08); --sh2:0 4px 16px rgba(0,0,0,.4),0 0 0 .5px rgba(255,255,255,.08); --sh3:0 24px 80px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.1);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs);line-height:20px;letter-spacing:-.24px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;text-align:left}
h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px}
h2{font-size:20px;line-height:25px;font-weight:700;letter-spacing:.38px}
h3{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.41px}
.eyebrow{display:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
.num,.money{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.glass{background:var(--side);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
/* Seitenleiste (6.7) */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
nav.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 8px 12px max(8px,env(safe-area-inset-left,0px));border-right:.5px solid var(--hair);display:flex;flex-direction:column;gap:2px}
.brand{font-family:var(--display);font-weight:700;font-size:17px;line-height:22px;padding:10px 12px 14px;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:24px;height:24px;border-radius:7px;background:conic-gradient(var(--ring1) 0 34%,var(--ring2) 0 67%,var(--ring3) 0);flex:none}
.nav-group{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;cursor:pointer;font:600 12px/16px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px;text-align:left;border-radius:8px}
.nav-group:hover{color:var(--fg)}
.nav-group svg.i{width:16px;height:16px}
.nav-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:36px;text-align:left;border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--fg);font:400 13px/18px var(--font);letter-spacing:-.08px}
.nav-btn:hover{background:var(--fill4)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nav-btn .cnt{font:600 11px/13px var(--font);min-width:20px;padding:3px 6px;border-radius:var(--r-badge);background:var(--bad-soft);color:var(--bad);text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:12px 12px 0;font-size:var(--fs-foot);line-height:16px;color:var(--muted)}
main{min-width:0;padding-block:32px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.topbar p{margin:4px 0 0;color:var(--muted);max-width:70ch;font-size:15px;line-height:20px}
.mobile-top,.tabbar{display:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Buttons (6.1) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:0;background:var(--accent-soft);color:var(--accent-text);padding:10px 20px;border-radius:var(--r-btn);cursor:pointer;white-space:nowrap;font:600 15px/20px var(--font);letter-spacing:-.24px;transition:background .15s ease,opacity .1s ease}
.btn:hover{background:rgba(0,122,255,.18)}
.btn:active{opacity:.85}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent-btn);color:#fff}
.btn.pri:hover{opacity:.85;background:var(--accent-btn)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:rgba(0,122,255,.06)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:32px;padding:6px 12px;font-size:13px;line-height:18px;border-radius:9px;position:relative}
.btn.sm::after{content:"";position:absolute;inset:-6px 0}
:focus{outline:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible,.card:focus-visible,a:focus-visible,[role="button"]:focus-visible{box-shadow:0 0 0 4px rgba(0,122,255,.25);transition:box-shadow .15s ease}
/* Kennzahlen (6.5) */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:var(--r);padding:14px 18px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--sh1)}
.kpi .lbl{font:500 11px/13px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font:700 22px/28px var(--display);letter-spacing:.35px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .sub{font-size:var(--fs-sub);line-height:18px;color:var(--muted)}
.kpi.alert{background:var(--bad-soft)}
.kpi.alert .val{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:32px;flex-wrap:wrap}
/* Listen als Karten */
.list{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh1)}
.row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;min-height:var(--row);padding:12px 16px;cursor:pointer;transition:background .15s ease}
.row+.row::before{content:"";position:absolute;top:0;left:46px;right:0;border-top:.5px solid var(--sep-soft)}
.row:hover{background:rgba(120,120,128,.04)}
.row .t{font-weight:400;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;line-height:18px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;font-size:13px;white-space:nowrap;color:var(--muted)}
.row .r .s{text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:var(--quat);margin-inline:7px}
.dot.bad{background:var(--red)}.dot.warn{background:var(--orange)}.dot.good{background:var(--green)}.dot.acc{background:var(--blue)}
/* Checkbox (6.11): 18px sichtbar, 44px Treffer */
.chk{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--sep);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;flex:none;font-size:12px;line-height:1;position:relative;color:#fff;margin-inline:3px}
.chk::after{content:"";position:absolute;inset:-13px}
.chk.on{background:var(--blue);border-color:var(--blue)}
/* Badges (6.6) */
.pill{display:inline-block;font:600 11px/13px var(--font);padding:3px 8px;border-radius:var(--r-badge);background:var(--fill4);color:var(--muted);white-space:nowrap;letter-spacing:.07px}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.good{background:var(--good-soft);color:var(--good)}.pill.acc{background:var(--accent-soft);color:var(--accent-text)}
/* Leerzustand (6.12) */
.empty{text-align:center;padding:40px 32px;color:var(--muted);font-size:15px;line-height:20px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh1)}
/* Segmente (6.3) */
.tabs{display:inline-flex;gap:0;padding:2px;border-radius:9px;background:var(--fill);overflow-x:auto;align-self:flex-start;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:7px 16px;min-height:32px;cursor:pointer;color:var(--muted);border-radius:7px;white-space:nowrap;font:500 13px/18px var(--font);transition:background .2s ease,color .2s ease}
.tab[aria-selected="true"]{background:var(--surface-solid);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:#636366}}
/* Eingaben (6.2) */
.search,.inp{border:.5px solid transparent;background:var(--fill);border-radius:var(--r-in);padding:10px 14px;min-height:44px;min-width:0;max-width:100%;font-size:15px}
.search:focus,.inp:focus{background:var(--surface-solid);border-color:rgba(0,122,255,.5);box-shadow:0 0 0 4px rgba(0,122,255,.25)}
.search{width:260px}
::placeholder{color:var(--faint)}
/* Diagramme (6.14) */
.bars{display:flex;flex-direction:column;gap:12px;background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--sh1)}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 110px;gap:12px;align-items:center;font-size:13px}
.bar .track{height:6px;background:var(--fill4);border-radius:3px;position:relative}
.bar .fill{display:block;height:100%;background:var(--blue);border-radius:3px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.chart{background:var(--surface);border-radius:var(--r);padding:20px;overflow-x:auto;box-shadow:var(--sh1);display:flex!important;flex-direction:column-reverse;gap:12px}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.chart svg line{stroke-dasharray:3 3;stroke-width:.5}
.chart svg text{font-family:var(--font);font-size:12px}
.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;line-height:18px;color:var(--muted);padding:0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;cursor:pointer;min-width:0;box-shadow:var(--sh1);border:0;transition:box-shadow .15s ease}
.card:hover{box-shadow:var(--sh2)}
.card h3{font-size:17px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13px}
.card dt{color:var(--muted)}.card dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--fill4);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--blue);border-radius:3px}
.prog.over i{background:var(--red)}
/* Tabellen (6.4) */
.tblw{background:var(--surface);border-radius:var(--r);overflow-x:auto;box-shadow:var(--sh1)}
.tbl{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{padding:12px 16px;border-bottom:.5px solid var(--sep-soft);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tbody tr:hover td{background:rgba(120,120,128,.04)}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--surface-solid)}
.tbl thead th{font:500 12px/16px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px 16px;border-bottom:.5px solid var(--sep)}
.tbl tr.sum td{font-weight:600;background:rgba(118,118,128,.06);border-top:.5px solid var(--sep)}
.tbl tr.sum:last-child td{font:700 16px/20px var(--font);background:rgba(0,122,255,.06);color:var(--accent-text);border-top:1px solid var(--sep)}
.tbl td.neg{color:var(--bad)}
.cell-ok{color:var(--good)!important;font-weight:600}.cell-miss{color:var(--bad)!important;font-weight:600}.cell-part{color:var(--warn)!important;font-weight:600}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:16px;overflow-x:auto;padding-bottom:6px}
.kcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.kcol h3,.agenda-day h3{font:600 12px/16px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.agenda-day{display:flex;flex-direction:column;gap:8px}
.banner{padding:12px 16px;border-radius:var(--r-btn);background:var(--warn-soft);color:var(--fg);font-size:15px;line-height:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner::before{content:"!";display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;font-size:12px;flex:none}
.banner.ok{background:var(--good-soft)}.banner.ok::before{content:"✓";background:var(--green)}
.banner.bad{background:var(--bad-soft)}.banner.bad::before{background:var(--red)}
.sync{font-size:var(--fs-foot);line-height:16px;color:var(--muted)}
.hide-money .money:not(.peek){filter:blur(7px);cursor:pointer;user-select:none}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--fg);min-height:32px}
.toggle input{width:18px;height:18px;accent-color:var(--blue)}
.quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--sh1)}
.quick .inp{flex:1 1 160px}
.ex{background:var(--surface);border-radius:var(--r);padding:16px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh1)}
.ex-h{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ex-h .nm{font-weight:600;font-size:17px;display:flex;gap:12px;align-items:center;min-width:0}
.sets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set{display:flex;gap:4px;align-items:center;font-size:var(--fs-foot);color:var(--muted)}
.set input{width:68px;border:0;background:var(--fill);border-radius:var(--r-in);padding:8px 10px;min-height:44px;font-size:15px;font-variant-numeric:tabular-nums}
/* Tagesringe */
.rings{display:flex;gap:28px;align-items:center;background:var(--surface);border-radius:var(--r);padding:20px 24px;box-shadow:var(--sh1);flex-wrap:wrap}
.rings svg{width:132px;height:132px;flex:none}
.rings .rg{fill:none;stroke-width:12;stroke-linecap:round}
.rings .bgring{stroke:var(--fill)}

/* Modal (6.8) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.40);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.sheet{background:var(--elev);-webkit-backdrop-filter:blur(40px) saturate(200%);backdrop-filter:blur(40px) saturate(200%);width:min(640px,100%);max-height:85vh;overflow-y:auto;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--sh3)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:modalin .3s cubic-bezier(.32,.72,0,1)}@keyframes modalin{from{opacity:0;transform:translateY(12px) scale(.98)}}}
.sheet h2{font:700 17px/22px var(--font);letter-spacing:-.41px}
.sheet form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}

.field input,.field select,.field textarea{border:.5px solid transparent;background:var(--fill);border-radius:var(--r-in);padding:10px 14px;min-height:44px;width:100%;font:400 17px/22px var(--font);letter-spacing:-.41px}
.field input:focus,.field select:focus,.field textarea:focus{background:var(--surface-solid);border-color:rgba(0,122,255,.5);box-shadow:0 0 0 4px rgba(0,122,255,.25)}
.field textarea{min-height:96px;resize:vertical}
.calc{background:rgba(0,122,255,.06);border-radius:var(--r-btn);padding:12px 14px;font-size:13px;line-height:18px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.sheet-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;position:sticky;bottom:-24px;background:var(--elev);padding-block:12px}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--bad);flex-wrap:wrap}
/* Toast (6.10) */
.toast{position:fixed;top:calc(24px + env(safe-area-inset-top,0px));right:max(24px,env(safe-area-inset-right,0px));background:var(--elev)!important;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:14px;padding:12px 20px;font:500 13px/18px var(--font);z-index:2000;box-shadow:0 8px 32px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.06);color:var(--fg)}

@media (prefers-contrast: more){:root{--sep-soft:var(--sep)}.glass,.sheet,.toast{background:var(--surface-solid)!important;-webkit-backdrop-filter:none;backdrop-filter:none}}

/* ===== Minimal Glass: nur Überschriften in SF Pro Display, alles andere SF Pro Text; mehr Luft, Glas auf ruhigem Farbgrund ===== */
:root{
  --font:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --display:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --glass-card:rgba(255,255,255,.58); --glass-edge:rgba(255,255,255,.75); --glass-line:rgba(0,0,0,.05);
  --glass-shadow:0 1px 1px rgba(0,0,0,.02),0 12px 40px rgba(31,38,64,.06);
  --wash-1:rgba(0,122,255,.10); --wash-2:rgba(88,86,214,.07); --wash-3:rgba(52,199,89,.06);
  --surface:var(--glass-card);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --glass-card:rgba(28,28,32,.52); --glass-edge:rgba(255,255,255,.09); --glass-line:rgba(255,255,255,.06);
  --glass-shadow:0 12px 40px rgba(0,0,0,.35);
  --wash-1:rgba(10,132,255,.16); --wash-2:rgba(94,92,230,.12); --wash-3:rgba(48,209,88,.07);
  --surface:var(--glass-card)}}
:root[data-theme="dark"]{
  --glass-card:rgba(28,28,32,.52); --glass-edge:rgba(255,255,255,.09); --glass-line:rgba(255,255,255,.06);
  --glass-shadow:0 12px 40px rgba(0,0,0,.35);
  --wash-1:rgba(10,132,255,.16); --wash-2:rgba(94,92,230,.12); --wash-3:rgba(48,209,88,.07);
  --surface:var(--glass-card)}
body{font-family:var(--font);background-color:var(--bg);background-image:radial-gradient(60vw 60vw at 85% -10%,var(--wash-1),transparent 60%),radial-gradient(50vw 50vw at -10% 40%,var(--wash-2),transparent 60%),radial-gradient(45vw 45vw at 70% 110%,var(--wash-3),transparent 60%);background-attachment:fixed}
/* Schrift: Display nur für Überschriften */
h1,h2,h3,.sheet h2,.rz-modal__title{font-family:var(--display)}
.kpi .val,.rings .leg b,.smart button .n,.prompt,.tbl tr.sum:last-child td,.kpi .lbl,.nav-group,.tabbar button,.btn,.tab,.pill,.field label,.field input,.field select,.field textarea,.jour textarea,.scale button,.toast,.set input,.search,.inp{font-family:var(--font)}
.brand{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.2px}
h1{font-size:40px;line-height:46px;font-weight:700;letter-spacing:-.5px}
h2{font-size:19px;line-height:24px;font-weight:600;letter-spacing:-.2px}
h3{font-size:16px;font-weight:600;letter-spacing:-.2px}
/* Glas für alle Inhaltsflächen */
.kpi,.list,.card,.bars,.chart,.tblw,.ex,.quick,.rings,.smart button,.jour,.moodstrip,.empty{background:var(--glass-card);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:.5px solid var(--glass-edge);box-shadow:var(--glass-shadow);border-radius:22px}
.tbl th:first-child,.tbl td:first-child{background:transparent;position:static}
.tbl tr.sum td{background:rgba(118,118,128,.05)}
nav.side{background:rgba(255,255,255,.35);border-right:.5px solid var(--glass-line)}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.side{background:rgba(20,20,24,.4)}}
.glass{-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
/* Mehr Luft */
main{padding-block:56px 96px;padding-left:max(56px,env(safe-area-inset-left,0px));padding-right:max(56px,env(safe-area-inset-right,0px))}

.nav-btn{border-radius:10px;padding:9px 14px;font-size:13.5px}

.nav-group{padding:22px 14px 8px;font-weight:500;letter-spacing:.06em}
nav.side{padding:calc(28px + env(safe-area-inset-top,0px)) 14px 20px max(14px,env(safe-area-inset-left,0px));gap:3px}

.sheet{border-radius:28px;padding:32px;background:var(--glass-card);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:.5px solid var(--glass-edge)}
.sheet-actions{background:transparent;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.field input,.field select,.field textarea{background:rgba(118,118,128,.08);border-radius:14px}
.toast{border-radius:999px;background:var(--glass-card)!important;border:.5px solid var(--glass-edge)}

.rings .bgring{stroke:rgba(118,118,128,.12)}
.prog,.bar .track{background:rgba(118,118,128,.12)}
@media (max-width:1023px){main{padding:0 32px 72px 32px}.mobile-top{margin-inline:-32px;padding-inline:32px}.wrap{gap:40px}}

    sub(db.doc('meta/sync'),s=>{S.meta=s.exists?s.data():{}});

  }catch(e){toast('Speichern fehlgeschlagen: '+(e.message||e.code||'unbekannter Fehler'));return false}
}

const shareOf=h=>(h.share==null||h.share==='')?1:(+h.share/100);
function liquid(ent){return S.accounts.filter(a=>a.type!=='Depot'&&a.type!=='Darlehen'&&(!ent||ent==='Alle'||a.entity===ent))}
function loanSigned(l){const b=Math.abs(+l.balance||0);return l.direction==='vergeben'?b:l.direction==='aufgenommen'?-b:0}
function calc(){
  const liq=sum(liquid(),a=>a.balance);
  const depot=sum(S.accounts.filter(a=>a.type==='Depot'),a=>a.balance);
  const hv=sum(S.holdings,h=>(+h.value||0)*shareOf(h));
  const debt=sum(S.loans.filter(l=>l.direction==='aufgenommen'),l=>Math.abs(+l.balance||0));
  const recv=sum(S.loans.filter(l=>l.direction==='vergeben'),l=>Math.abs(+l.balance||0));
  const openInv=S.invoices.filter(i=>i.status==='offen'&&i.kind!=='Gutschrift');
  const dueSoon=openInv.filter(i=>{const n=days(i.due);return n!=null&&n<=14});
  const missingBal=S.accounts.filter(a=>a.balance==null||a.balance==='').length;
  return {liq,depot,hv,debt,recv,net:liq+depot+hv+recv-debt,openInv,openSum:sum(openInv,i=>i.amount),dueSoon,missingBal};
}
function occurs(start,end,interval,k){
  const s=start?start.slice(0,7):TODAY().slice(0,7);
  const d=mIdx(k)-mIdx(s); if(d<0)return false;
  if(end&&k>end.slice(0,7))return false;
  const step=IV_M[interval]===undefined?1:IV_M[interval];
  if(step===0)return d===0; return d%step===0;
}
const holdingEntity=name=>{const h=S.holdings.find(x=>x.name===name);return h&&h.entity?h.entity:'Privat'};
function unitEntity(u){const p=(u.property||'');const hit=ENT.find(e=>p.startsWith(e));return hit||holdingEntity(p)}
function dealCalc(d){
  const price=+d.price||0, anc=price*((+d.ancillary||0)/100), capex=+d.capex||0, total=price+anc+capex, debt=+d.debt||0;
  const eq=total-debt, exit=+d.exitValue||0, margin=exit?exit-total:null;
  return {price,anc,capex,total,debt,eq,exit,margin,marginPct:exit&&total?margin/total*100:null,roe:exit&&eq>0?margin/eq*100:null,sqm:d.area?price/+d.area:null,totalSqm:d.area?total/+d.area:null};
}
function forecast(ent,opt={}){
  const months=[];for(let i=0;i<12;i++)months.push(monthKey(i));
  const inEnt=e=>ent==='Alle'||(e||'Privat')===ent;
  const rows={};const add=(src,k,v)=>{if(!v)return;rows[src]=rows[src]||{};rows[src][k]=(rows[src][k]||0)+v};
  months.forEach((k,i)=>{
    S.plan.forEach(p=>{if(inEnt(p.entity)&&occurs(p.start,p.end,p.interval||'monatlich',k))add(p.kind==='Einnahme'?'Planpositionen Einnahmen':'Planpositionen Ausgaben',k,(p.kind==='Einnahme'?1:-1)*Math.abs(+p.amount||0))});
    S.units.forEach(u=>{if(u.status==='vermietet'&&inEnt(unitEntity(u))&&(!u.end||k<=u.end.slice(0,7))&&(!u.start||k>=u.start.slice(0,7)))add('Mieteinnahmen',k,+u.rent||0)});
    S.contracts.forEach(c=>{if(inEnt(c.entity)&&c.cost&&occurs(c.start||c.renewal||TODAY(),null,c.interval||'monatlich',k))add('Verträge & Versicherungen',k,-Math.abs(+c.cost))});
    S.loans.forEach(l=>{if(l.inPlan!=='nein'&&l.installment&&inEnt(l.entity)&&(!l.maturity||k<=l.maturity.slice(0,7))&&(!l.start||k>=l.start.slice(0,7)))add('Kreditraten',k,(l.direction==='vergeben'?1:-1)*Math.abs(+l.installment))});
    S.invoices.forEach(v=>{if(v.status!=='offen'||!inEnt(v.entity))return;const dk=(v.due||TODAY()).slice(0,7);if(dk===k||(i===0&&dk<k))add('Offene Rechnungen',k,(v.kind==='Gutschrift'?1:-1)*Math.abs(+v.amount||0))});
    S.deals.forEach(d=>{if(d.inPlan==='nein'||!inEnt(d.entity)||!['Angebot','Finanzierung','Beurkundet'].includes(d.stage)||!d.closingDate)return;const c=dealCalc(d);if(d.closingDate.slice(0,7)===k)add('Ankäufe (EK)',k,-c.eq);if(c.exit&&d.holdMonths&&addMonths(d.closingDate,+d.holdMonths).slice(0,7)===k)add('Exits (netto nach FK)',k,c.exit-c.debt)});
    const sc=[...S.scenarios.filter(s=>s.active==='ja'),...(opt.extra?[opt.extra]:[])];
    sc.forEach(s=>{if(!inEnt(s.entity))return;const lab=s===opt.extra?'Szenario (Test)':'Szenarien';if(s.oneOff&&(s.oneOffDate||TODAY()).slice(0,7)===k)add(lab,k,+s.oneOff);if(s.monthly&&occurs(s.start||TODAY(),s.end,'monatlich',k))add(lab,k,+s.monthly)});
  });
  const start=sum(liquid(ent),a=>a.balance);
  let bal=start;const net={},balance={};
  months.forEach(k=>{const n=Object.values(rows).reduce((t,r)=>t+(r[k]||0),0);net[k]=n;bal+=n;balance[k]=bal});
  const reserve=reserveOf(ent);
  const firstShort=months.find(k=>balance[k]<reserve);
  return {months,rows,net,balance,start,reserve,firstShort,min:Math.min(start,...months.map(k=>balance[k]))};
}
function reserveOf(ent){const r=(S.settings&&S.settings.reserve)||{};return ent==='Alle'?ENT.reduce((t,e)=>t+(+r[e]||0),0):(+r[ent]||0)}
function spendByCat(k,ent='Privat'){const m={};S.transactions.filter(x=>(x.date||'').startsWith(k)&&(+x.amount)<0&&x.category!=='Umbuchung'&&(x.entity||'Privat')===ent).forEach(x=>{const c=x.category||'Sonstiges';m[c]=(m[c]||0)+Math.abs(+x.amount)});return m}
function monthIO(k,ent='Privat'){const tx=S.transactions.filter(x=>(x.date||'').startsWith(k)&&x.category!=='Umbuchung'&&(ent==='Alle'||(x.entity||'Privat')===ent));return {inc:sum(tx.filter(x=>+x.amount>0),x=>x.amount),out:Math.abs(sum(tx.filter(x=>+x.amount<0),x=>x.amount))}}
function detectSubs(){
  const since=monthKey(-6);const g={};
  S.transactions.filter(x=>+x.amount<0&&(x.date||'')>=since&&x.category!=='Umbuchung').forEach(x=>{const key=String(x.counterparty||x.purpose||'').toLowerCase().replace(/[0-9]/g,'').replace(/\s+/g,' ').trim().slice(0,28);if(!key)return;(g[key]=g[key]||[]).push(x)});
  const known=S.contracts.map(c=>String(c.provider||c.title||'').toLowerCase());
  return Object.entries(g).map(([k,xs])=>{const ms=new Set(xs.map(x=>x.date.slice(0,7)));const amts=xs.map(x=>Math.abs(+x.amount));const avg=sum(amts,a=>a)/amts.length;const stable=amts.every(a=>Math.abs(a-avg)<=Math.max(2,avg*.12));return {k,name:xs[0].counterparty||xs[0].purpose,months:ms.size,avg,stable,entity:xs[0].entity||'Privat',known:known.some(n=>n&&(k.includes(n.slice(0,8))||n.includes(k.slice(0,8))))}}).filter(x=>x.months>=3&&x.stable).sort((a,b)=>b.avg-a.avg);
}
function loanSim(l){
  const r=(+l.rate||0)/100/12, inst=+l.installment||0;let bal=Math.abs(+l.balance||0);
  const from=l.asOf||TODAY();const to=l.fixedUntil;if(!to||!inst)return null;
  const n=Math.max(0,mIdx(to.slice(0,7))-mIdx(from.slice(0,7)));
  let interest=0;for(let i=0;i<n&&bal>0;i++){const z=bal*r;interest+=z;bal=Math.max(0,bal-(inst-z))}
  return {months:n,rest:bal,interest};
}
function dutyNext(d){const m=IV_M[d.recurrence];return m?addMonths(d.due,m):null}
function deadlines(horizon=60){
  const out=[];const inH=(s,h=horizon)=>{const n=days(s);return n!=null&&n<=h};
  S.contracts.forEach(c=>{if(c.noticeBy&&inH(c.noticeBy)&&days(c.noticeBy)>=-7)out.push({date:c.noticeBy,title:`Kündigungsfrist: ${c.title}`,sub:c.provider||c.kind||'',coll:'contracts',id:c.id})});
  S.legal.forEach(l=>{if(l.deadline&&l.status!=='abgeschlossen'&&inH(l.deadline))out.push({date:l.deadline,title:`Frist: ${l.title}`,sub:l.counterparty||'',coll:'legal',id:l.id})});
  S.invoices.forEach(i=>{if(i.status==='offen'&&i.due&&inH(i.due))out.push({date:i.due,title:`Zahlung: ${i.title}`,sub:i.issuer||'',amount:i.amount,coll:'invoices',id:i.id})});
  S.duties.forEach(d=>{if(d.status!=='erledigt'&&d.due&&inH(d.due))out.push({date:d.due,title:d.title,sub:d.entity||'',coll:'duties',id:d.id})});
  S.documents.forEach(d=>{if(d.validUntil&&inH(d.validUntil,Math.max(horizon,90)))out.push({date:d.validUntil,title:`Läuft ab: ${d.title}`,sub:d.category||'',coll:'documents',id:d.id})});
  S.loans.forEach(l=>{if(l.fixedUntil&&inH(l.fixedUntil,Math.max(horizon,180))&&days(l.fixedUntil)>=0)out.push({date:l.fixedUntil,title:`Zinsbindung endet: ${l.name}`,sub:l.lender||'',coll:'loans',id:l.id})});
  S.units.forEach(u=>{if(u.end&&inH(u.end,Math.max(horizon,60))&&days(u.end)>=0)out.push({date:u.end,title:`Mietende: ${u.unit} (${u.tenant||'–'})`,sub:u.property||'',coll:'units',id:u.id})});
  S.people.forEach(p=>{if(p.birthday){const b=parseD(p.birthday);const now=new Date();let nb=new Date(now.getFullYear(),b.getMonth(),b.getDate());if(days(iso(nb))<0)nb=new Date(now.getFullYear()+1,b.getMonth(),b.getDate());const n=days(iso(nb));if(n<=Math.min(horizon,30))out.push({date:iso(nb),title:`Geburtstag: ${p.name}`,sub:p.relation||'',coll:'people',id:p.id})}});
  return out.sort((a,b)=>a.date<b.date?-1:1);
}
function contactDue(){return S.people.filter(p=>p.cadence&&CAD_DAYS[p.cadence]).map(p=>({p,over:p.lastContact?(-days(p.lastContact))-CAD_DAYS[p.cadence]:999})).filter(x=>x.over>=0).sort((a,b)=>b.over-a.over)}
function rentStatus(u,k){
  const exp=+u.rent||0;if(!exp||u.status!=='vermietet')return null;
  if(u.start&&k<u.start.slice(0,7))return null;if(u.end&&k>u.end.slice(0,7))return null;

function niceTop(max){if(max<=0)return 1;const step=Math.pow(10,Math.floor(Math.log10(max)));return ([1,2,2.5,5,10].map(m=>m*step).find(v=>v*4>=max)||step*10)*4}
const kfmt=v=>Math.abs(v)>=1e6?nf1.format(v/1e6)+' Mio':Math.abs(v)>=1000?nf.format(Math.round(v/1000))+'k':nf.format(Math.round(v));
function lineChart(labels,series,opts={}){
  const vals=series.flatMap(s=>s.v.filter(x=>x!=null));if(opts.ref!=null)vals.push(opts.ref);
  let lo=Math.min(0,...vals),hi=Math.max(...vals,1);const span=niceTop(hi-lo);const step=span/4;lo=Math.floor(lo/step)*step;hi=lo+span;if(Math.max(...vals)>hi)hi+=step;
  const W=760,H=240,L=64,B=28,T=12,R=12,n=labels.length,x=i=>L+(n<=1?0:i*(W-L-R)/(n-1)),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Verlauf')}">`;
  for(let v=lo;v<=hi+1e-9;v+=step){s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${kfmt(v)}</text>`}
  if(opts.ref!=null)s+=`<line x1="${L}" x2="${W-R}" y1="${y(opts.ref)}" y2="${y(opts.ref)}" stroke="var(--bad)" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(opts.ref)-5}" text-anchor="end" font-size="11" fill="var(--bad)">${esc(opts.refLabel||'')}</text>`;
  labels.forEach((l,i)=>{if(n<=12||i%Math.ceil(n/12)===0)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(l)}</text>`});
  series.forEach(se=>{const pts=se.v.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);if(!pts.length)return;
    if(se.area)s+=`<path d="M${pts[0][0]},${y(Math.max(lo,0))} ${pts.map(p=>'L'+p[0]+','+p[1]).join(' ')} L${pts[pts.length-1][0]},${y(Math.max(lo,0))} Z" fill="${se.c}" opacity=".12"/>`;
    s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${se.c}" stroke-width="2" ${se.dash?'stroke-dasharray="6 4"':''}/>`;
    const lp=pts[pts.length-1];s+=`<circle cx="${lp[0]}" cy="${lp[1]}" r="3.5" fill="${se.c}"/>`;

  s+='</svg>';
  return `<div class="chart ${opts.unit==='kg'?'':'money'}" style="display:block"><div class="legend">${series.map(se=>`<span style="--c:${se.c}">${esc(se.n)}</span>`).join('')}${opts.ref!=null?`<span style="--c:var(--bad)">${esc(opts.refLabel||'Grenze')}</span>`:''}</div>${s}</div>`;
}

function streak(id){let n=0;const d=new Date();for(let i=0;i<60;i++){const k=iso(d);const l=S.habitlog.find(x=>x.date===k);if(l&&l.done&&l.done[id])n++;else if(i>0)break;d.setDate(d.getDate()-1)}return n}

function ringData(){

  return [
    {n:'To-Dos',c:'var(--ring1)',v:tDone,of:todayT.length,txt:todayT.length?`${tDone} von ${todayT.length}`:'nichts fällig',go:'todo'},

}

function todoSort(a,b){const da=a.due||'9999',db_=b.due||'9999';if(da!==db_)return da<db_?-1:1;if((+b.priority||0)!==(+a.priority||0))return (+b.priority||0)-(+a.priority||0);return (a.time||'')<(b.time||'')?-1:1}

function nextDue(r){const d=r.due||TODAY();switch(r.recurrence){case 'täglich':return addDays(d,1);case 'werktags':{let x=addDays(d,1);while([0,6].includes(parseD(x).getDay()))x=addDays(x,1);return x}case 'wöchentlich':return addDays(d,7);case 'monatlich':return addMonths(d,1);case 'jährlich':return addMonths(d,12);default:return null}}
async function todoDone(id){

}
function parseQuick(title){let due=null;const m=title.match(/\s+(heute|morgen|übermorgen)$/i);if(m){title=title.slice(0,m.index);due=addDays(TODAY(),{heute:0,morgen:1,übermorgen:2}[m[1].toLowerCase()])}let priority=null;const p=title.match(/^(!{1,3})\s*/);if(p){priority=String(p[1].length);title=title.slice(p[0].length)}return {title:title.trim(),due,priority}}

const MONL=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

const srcColor=k=>(CAL_SRC.find(x=>x[0]===k)||[0,0,'#8E8E93'])[2];
function evSrc(e){const c=String(e.calendar||'');return /lestate|outlook/i.test(c)?'lestate':/icloud/i.test(c)?'icloud':'privat'}

function occDates(e,from,to){const s=e.date;if(!s)return[];const st=REP_STEP[e.repeat];if(!st)return s>=from&&s<=to?[s]:[];
  const at=i=>st[1]==='d'?addDays(s,st[0]*i):addMonths(s,st[0]*i);const end=e.until&&e.until<to?e.until:to;
  let i=0;if(from>s)i=Math.max(0,(st[1]==='d'?Math.floor((parseD(from)-parseD(s))/864e5/st[0]):Math.floor((mIdx(from.slice(0,7))-mIdx(s.slice(0,7)))/st[0]))-1);
  const out=[];for(let g=0;g<400;g++,i++){const d=at(i);if(d>end)break;if(d>=from)out.push(d)}return out}
function calHidden(){return new Set(String(ui.tab.calHide||'').split(',').filter(Boolean))}

function cashBars(ks,data){
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.out)));const top=niceTop(max),step=top/4;
  const W=760,H=240,L=64,B=28,T=10,cw=(W-L-10)/ks.length,y=v=>T+(H-T-B)*(1-v/top);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Einnahmen und Ausgaben pro Monat">`;
  for(let i=0;i<=4;i++){const v=step*i;s+=`<line x1="${L}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${kfmt(v)}</text>`}
  data.forEach((d,i)=>{const x=L+i*cw+cw*.18,bw=cw*.3;s+=`<rect x="${x}" y="${y(d.inc)}" width="${bw}" height="${y(0)-y(d.inc)}" rx="2" fill="var(--good)"><title>${monthName(ks[i])} Einnahmen ${eur.format(d.inc)}</title></rect><rect x="${x+bw+2}" y="${y(d.out)}" width="${bw}" height="${y(0)-y(d.out)}" rx="2" fill="var(--accent)"><title>${monthName(ks[i])} Ausgaben ${eur.format(d.out)}</title></rect><text x="${L+i*cw+cw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${MON[+ks[i].slice(5)-1]}</text>`});
  return `<div class="chart money" style="display:block"><div class="legend"><span style="--c:var(--good)">Einnahmen</span><span style="--c:var(--accent)">Ausgaben</span></div>${s}</svg></div>`;
}
function importHTML(){

  <p class="sync" style="margin:0">Exportiere die Umsätze als CSV aus Revolut, Commerzbank, Sparkasse oder ING und wähle die Datei aus. Spalten werden erkannt, Duplikate übersprungen, Kategorien vorgeschlagen. Buchungen von Objekt-Konten werden automatisch der Steuer-Zuordnung „Anlage V“ vorgeschlagen.</p>

  } else {

};

// ---------- Immobilien & Firmen ----------
V.immo=()=>{
  const tb=tabs('immo',[['beteiligungen','Beteiligungen'],['objekte','Objekt-Controlling'],['finanz','Finanzierungen'],['pflichten','Gesellschafts-Pflichten'],['steuer','Steuerordner'],['deals','Deal-Pipeline']]);
  let body='';
  if(tb.cur==='beteiligungen'){
    const card=h=>{const ls=S.loans.filter(l=>l.holding===h.name&&l.direction==='aufgenommen');const debt=sum(ls,l=>Math.abs(+l.balance||0));const ltv=h.value&&debt?debt/h.value*100:null;const rent=sum(S.units.filter(u=>u.property===h.name&&u.status==='vermietet'),u=>u.rent);

      <dl><dt>Gehalten über</dt><dd>${esc(h.entity||'–')}${h.share?` · ${nf.format(h.share)} %`:''}</dd><dt>Verkehrswert</dt><dd>${M(h.value)}</dd>${debt?`<dt>Darlehen</dt><dd>${M(debt)}</dd>`:''}${ltv!=null?`<dt>LTV</dt><dd class="num">${nf.format(Math.round(ltv))} %</dd>`:''}${rent?`<dt>Soll-Miete / Monat</dt><dd>${M(rent)}</dd>`:''}${rent&&h.value?`<dt>Bruttorendite</dt><dd class="num">${nf1.format(rent*12/h.value*100)} %</dd>`:''}</dl>

  } else if(tb.cur==='objekte'){
    const props=propNames();const p=props.includes(ui.tab.prop)?ui.tab.prop:(props[0]||'');

    const ks=[];for(let i=-5;i<=0;i++)ks.push(monthKey(i));
    const soll=sum(us.filter(u=>u.status==='vermietet'),u=>u.rent);const kaution=sum(us,u=>u.deposit);const free=us.filter(u=>u.status!=='vermietet').length;
    const cxP=sum(cx,x=>x.plan),cxA=sum(cx,x=>x.actual);const h=S.holdings.find(x=>x.name===p);
    body=`<div class="panel-h"><div class="tools">${props.length?selectUI('prop',props,p,'Objekt'):''}</div><div class="tools"><button class="btn sm" data-newp="units" data-preset='${esc(JSON.stringify({property:p,status:'vermietet'}))}'>+ Einheit / Zimmer</button><button class="btn sm" data-newp="capex" data-preset='${esc(JSON.stringify({property:p,status:'geplant'}))}'>+ Sanierungsposten</button></div></div>
    ${!props.length?'<div class="empty">Lege zuerst ein Objekt unter „Beteiligungen“ an (Art: Immobilie oder Projekt).</div>':`
    <div class="kpis"><div class="kpi"><span class="lbl">Soll-Miete / Monat</span><span class="val">${M(soll)}</span><span class="sub">${us.length} Einheiten · ${free} frei</span></div><div class="kpi"><span class="lbl">Kautionen</span><span class="val">${M(kaution)}</span><span class="sub">gehalten</span></div><div class="kpi ${cxP&&cxA>cxP?'alert':''}"><span class="lbl">Sanierung Ist / Plan</span><span class="val">${M(cxA)}</span><span class="sub">Budget ${M(cxP)}${cxP?` · ${nf.format(Math.round(cxA/cxP*100))} %`:''}</span></div><div class="kpi"><span class="lbl">Bruttomietrendite</span><span class="val num">${h&&h.value&&soll?nf1.format(soll*12/h.value*100)+' %':'–'}</span><span class="sub">${h&&h.value?'auf Verkehrswert':'Verkehrswert fehlt'}</span></div></div>
    ${panel('Mieter & Mieteingang (Soll/Ist)',us.length?`<div class="tblw"><table class="tbl"><thead><tr><th>Einheit</th><th>Mieter</th><th>Miete</th>${ks.map(k=>`<th>${MON[+k.slice(5)-1]}</th>`).join('')}</tr></thead><tbody>${us.map(u=>`<tr data-edit="units" data-id="${esc(u.id)}" style="cursor:pointer"><td>${esc(u.unit)}</td><td style="text-align:left">${esc(u.tenant||'–')}${u.status!=='vermietet'?` <span class="pill warn">${esc(u.status)}</span>`:''}</td><td>${M(u.rent)}</td>${ks.map(k=>{const r=rentStatus(u,k);if(!r)return '<td></td>';return `<td class="cell-${r.st==='pend'?'':r.st}" title="Soll ${eur.format(r.exp)}, Ist ${eur.format(r.got)}">${r.st==='ok'?'✓':r.st==='part'?'teilw.':r.st==='miss'?'fehlt':'…'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><p class="sync">Abgleich über Gutschriften im Kontoauszug, deren Gegenpartei oder Verwendungszweck das Erkennungs-Stichwort oder den Nachnamen enthält.</p>`:'<div class="empty">Noch keine Einheiten. Lege die WG-Zimmer mit Mieter, Pauschalmiete, Kaution und Erkennungs-Stichwort an.</div>')}
    ${panel('Sanierungsbudget',cx.length?barsHTML(cx.map(x=>[x.item+(x.vendor?' · '+x.vendor:''),+x.actual||0,+x.plan||0]),''):'<div class="empty">Keine Sanierungsposten.</div>')}
    ${cx.length?listHTML(cx.map(x=>rowHTML({coll:'capex',id:x.id,t:x.item,s:esc([x.vendor,x.status].filter(Boolean).join(' · ')),r:M(x.actual),rs:'Plan '+eur.format(+x.plan||0),tone:x.plan&&x.actual>x.plan?'bad':x.status==='abgeschlossen'?'good':''})),''):''}`}`;
  } else if(tb.cur==='finanz'){
    const ls=S.loans;const up=ls.filter(l=>l.direction==='aufgenommen');const tot=sum(up,l=>Math.abs(+l.balance||0));
    const wr=tot?sum(up,l=>Math.abs(+l.balance||0)*(+l.rate||0))/tot:null;const ds=sum(up,l=>l.installment);

    <div class="kpis"><div class="kpi"><span class="lbl">Restschuld gesamt</span><span class="val">${M(tot)}</span><span class="sub">${up.length} Darlehen aufgenommen</span></div><div class="kpi"><span class="lbl">Ø Zins</span><span class="val num">${wr!=null?nf.format(Math.round(wr*100)/100)+' %':'–'}</span><span class="sub">gewichtet nach Restschuld</span></div><div class="kpi"><span class="lbl">Kapitaldienst / Monat</span><span class="val">${M(ds)}</span></div><div class="kpi"><span class="lbl">Zinsen / Jahr (ca.)</span><span class="val">${M(sum(up,l=>Math.abs(+l.balance||0)*(+l.rate||0)/100))}</span></div></div>
    ${ls.length?`<div class="cards">${ls.map(l=>{const sim=loanSim(l);const fm=l.fixedUntil?mIdx(l.fixedUntil.slice(0,7))-mIdx(TODAY().slice(0,7)):null;return `<div class="card" tabindex="0" data-edit="loans" data-id="${esc(l.id)}"><div class="panel-h" style="min-height:0"><h3>${esc(l.name)}</h3><span class="pill ${l.direction==='vergeben'?'good':l.direction?'acc':'warn'}">${esc(l.direction||'Richtung offen')}</span></div><dl><dt>${l.direction==='vergeben'?'Darlehensnehmer':'Darlehensgeber'}</dt><dd>${esc(l.lender||'–')}</dd><dt>Restschuld</dt><dd>${M(l.balance)}</dd><dt>Zins</dt><dd class="num">${l.rate!=null&&l.rate!==''?nf.format(+l.rate)+' %':'–'}</dd><dt>Rate / Monat</dt><dd>${M(l.installment)}</dd><dt>Zinsbindung</dt><dd>${l.fixedUntil?fd(l.fixedUntil):'–'}</dd>${sim?`<dt>Restschuld bei Ablauf</dt><dd>${M(sim.rest)}</dd><dt>Zinsen bis dahin</dt><dd>${M(sim.interest)}</dd>`:''}</dl>${fm!=null&&fm<=18&&fm>=0?`<span class="pill ${fm<=6?'bad':'warn'}">Anschlussfinanzierung in ${fm} Monaten klären</span>`:''}${l.holding?`<div class="sync">Objekt: ${esc(l.holding)}</div>`:''}</div>`}).join('')}</div>`:'<div class="empty">Noch keine Finanzierungen.</div>'}`;
  } else if(tb.cur==='pflichten'){
    const ent=ui.tab.dutyEnt||'alle';let ds=S.duties.filter(d=>ent==='alle'||d.entity===ent);
    const open=ds.filter(d=>d.status!=='erledigt').sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);const done=ds.filter(d=>d.status==='erledigt').sort((a,b)=>(a.due||'')<(b.due||'')?1:-1).slice(0,15);
    body=`<div class="panel-h"><div class="tools">${selectUI('dutyEnt',[['alle','Alle Gesellschaften'],...ENT],ent,'Gesellschaft')}</div><button class="btn sm" data-new="duties">+ Pflicht</button></div>
    <p class="sync" style="margin:0">Wiederkehrende Pflichten legen beim Abhaken automatisch den nächsten Termin an. Allgemeine gesetzliche Fristen, mit Bescheiden und Finanzamt-Schreiben abgleichen. Einträge mit „prüfen“ sind Annahmen.</p>
    ${listHTML(open.map(d=>rowHTML({coll:'duties',id:d.id,lead:`<button class="chk" data-duty="${esc(d.id)}" aria-label="Erledigt"></button>`,t:d.title,s:esc([d.entity,d.recurrence,d.check].filter(Boolean).join(' · ')),r:d.due?`<span class="pill ${due(d.due,14)}">${fd(d.due)}</span>`:'',rs:d.due?rel(d.due):''})),'Keine offenen Pflichten.')}
    ${done.length?panel('Zuletzt erledigt',listHTML(done.map(d=>rowHTML({coll:'duties',id:d.id,lead:checkBtn('duties',d.id,true),t:d.title,s:esc(d.entity||''),r:fd(d.due),tone:'good'})),'')):''}`;
  } else if(tb.cur==='steuer'){
    const years=[...new Set([TODAY().slice(0,4),...S.transactions.map(x=>(x.date||'').slice(0,4)).filter(Boolean)])].sort().reverse();
    const y=years.includes(ui.tab.taxYear)?ui.tab.taxYear:years[0];
    const tx=S.transactions.filter(x=>(x.date||'').startsWith(y));const inv=S.invoices.filter(x=>(x.due||x.updatedAt||'').startsWith(y));const docs=S.documents.filter(x=>(x.date||'').startsWith(y));
    const tag=ui.tab.taxTag||'';
    const rows=TAX.map(t=>{const a=tx.filter(x=>x.taxTag===t);return {t,n:a.length,sum:sum(a,x=>x.amount),miss:a.filter(x=>+x.amount<0&&!x.receipt&&!x.receiptId).length,inv:inv.filter(x=>x.taxTag===t).length,docs:docs.filter(x=>x.taxTag===t).length}});
    const untagged=tx.filter(x=>!x.taxTag&&x.entity&&x.entity!=='Privat'&&guessTax(x.entity,+x.amount));
    const sel=tag?tx.filter(x=>x.taxTag===tag):[];
    const pEnt=ENT.includes(ui.tab.pkgEnt)?ui.tab.pkgEnt:(ENT.find(e=>e!=='Privat')||'Privat');const pd=taxData(pEnt,y);const miss=ui.tab.taxMiss||'';

      <div class="kpis pkgk"><div class="kpi"><span class="lbl">Buchungen</span><span class="val num">${pd.tx.length}</span><span class="sub money">${M(pd.inc)} ein · ${M(Math.abs(pd.out))} aus</span></div>
      <div class="kpi ${pd.noRec.length?'alert':''}" role="button" tabindex="0" data-taxmiss="rec" style="cursor:pointer"><span class="lbl">Ohne Beleg</span><span class="val num">${pd.noRec.length}</span><span class="sub">Ausgaben · antippen zum Nachtragen</span></div>
      ${pEnt!=='Privat'?`<div class="kpi ${pd.noTag.length?'alert':''}" role="button" tabindex="0" data-taxmiss="tag" style="cursor:pointer"><span class="lbl">Ohne Zuordnung</span><span class="val num">${pd.noTag.length}</span><span class="sub">Steuer-Zuordnung fehlt</span></div>`:''}

      <p class="sync">Das ZIP enthält eine Excel-Datei (Übersicht, Buchungen, Kategorien, fehlende Belege, Rechnungen, Dokumente), eine PDF-Zusammenfassung und alle Belege, benannt nach Datum, Betrag und Gegenpartei.</p>`);
    body=`<div class="panel-h"><div class="tools">${selectUI('taxYear',years,y,'Jahr')}</div></div>
    ${pkg}
    <div class="tblw money"><table class="tbl"><thead><tr><th>Zuordnung</th><th>Buchungen</th><th>Summe</th><th>ohne Beleg</th><th>Rechnungen</th><th>Dokumente</th></tr></thead><tbody>${rows.map(r=>`<tr data-taxsel="${esc(r.t)}" style="cursor:pointer"><td>${esc(r.t)}</td><td>${r.n||''}</td><td class="${r.sum<0?'neg':''}">${r.n?nf.format(Math.round(r.sum)):''}</td><td>${r.miss?`<span class="pill warn">${r.miss}</span>`:''}</td><td>${r.inv||''}</td><td>${r.docs||''}</td></tr>`).join('')}</tbody></table></div>

    ${tag?panel(esc(tag)+' · '+y,listHTML(sel.map(x=>rowHTML({coll:'transactions',id:x.id,t:x.counterparty||x.purpose||'Buchung',s:esc([x.category,x.account].filter(Boolean).join(' · ')),r:M(x.amount,true),rs:(x.receipt||x.receiptId)?'<span class="pill good">Beleg</span>':'<span class="pill warn">Beleg fehlt</span>'})),'Keine Buchungen.')):'<p class="sync">Tippe auf eine Zeile für die Einzelbuchungen. Zuordnungen setzt du in jeder Buchung, Rechnung und jedem Dokument.</p>'}`;
  } else {
    const cols=STAGES;
    body=`<div class="panel-h"><span class="sync">Kennzahlen aus Kaufpreis, Nebenkosten, Sanierung, Fremdkapital und Exit-Wert. Deals ab Phase „Angebot“ mit Beurkundungsdatum fließen in den Liquiditätsplan.</span><button class="btn sm" data-new="deals">+ Deal</button></div>

V.verwaltung=()=>{
  const tb=tabs('verw',[['dokumente','Dokumente'],['vertraege','Verträge & Versicherungen'],['recht','Rechtliches']]);
  let body='';
  if(tb.cur==='dokumente'){
    const docs=S.documents.filter(d=>match('docs',d,['title','category','entity','note'])).sort((a,b)=>(a.category||'')<(b.category||'')?-1:1);
    body=`<div class="panel-h"><div class="tools">${searchBox('docs','Dokumente durchsuchen')}</div><button class="btn sm" data-new="documents">+ Dokument</button></div>
    ${listHTML(docs.map(d=>rowHTML({coll:'documents',id:d.id,t:d.title,s:esc([d.category,d.entity,d.date?fd(d.date):''].filter(Boolean).join(' · ')),r:d.link?`<a href="${esc(d.link)}" target="_blank" rel="noopener" data-stop>öffnen</a>`:'',rs:d.validUntil?`<span class="pill ${due(d.validUntil,90)}">gültig bis ${fd(d.validUntil)}</span>`:''})),'Noch keine Dokumente. Lege wichtige Unterlagen mit Link ab, z. B. Ausweis (Ablaufdatum), Gesellschaftsvertrag, Kaufvertrag Stockkampstraße.')}`;
  } else if(tb.cur==='vertraege'){
    const cs=[...S.contracts].sort((a,b)=>(a.noticeBy||'9')<(b.noticeBy||'9')?-1:1);
    const perMonth=sum(cs,c=>(+c.cost||0)*({monatlich:1,quartalsweise:1/3,halbjährlich:1/6,jährlich:1/12,einmalig:0}[c.interval]??1));
    body=`<div class="kpis"><div class="kpi"><span class="lbl">Laufende Verträge</span><span class="val num">${cs.length}</span><span class="sub">${cs.filter(c=>c.kind==='Versicherung').length} Versicherungen</span></div><div class="kpi"><span class="lbl">Fixkosten / Monat</span><span class="val">${M(perMonth)}</span><span class="sub">umgerechnet aus allen Intervallen</span></div><div class="kpi"><span class="lbl">Kündbar in 60 Tagen</span><span class="val num">${cs.filter(c=>{const n=days(c.noticeBy);return n!=null&&n>=0&&n<=60}).length}</span></div></div>
    ${panel('Verträge & Versicherungen',listHTML(cs.map(c=>rowHTML({coll:'contracts',id:c.id,t:c.title,s:esc([c.provider,c.kind,c.entity].filter(Boolean).join(' · ')),r:c.cost?`${M(c.cost,true)} <span class="s">${esc(c.interval||'')}</span>`:'',rs:c.noticeBy?`<span class="pill ${due(c.noticeBy,60)}">kündigen bis ${fd(c.noticeBy)}</span>`:esc(c.notice||''),tone:due(c.noticeBy,60)})),'Noch keine Verträge.'),'contracts')}`;
  } else {
    const ls=[...S.legal].sort((a,b)=>(a.status==='abgeschlossen'?1:0)-(b.status==='abgeschlossen'?1:0)||((a.deadline||'9')<(b.deadline||'9')?-1:1));
    body=panel('Rechtliche Vorgänge',listHTML(ls.map(l=>rowHTML({coll:'legal',id:l.id,t:l.title,s:esc([l.counterparty,l.lawyer,l.status].filter(Boolean).join(' · ')),r:l.deadline?`<span class="pill ${due(l.deadline,14)}">Frist ${fd(l.deadline)}</span>`:'',tone:l.status==='abgeschlossen'?'good':due(l.deadline,14)||'acc'})),'Keine Vorgänge erfasst.'),'legal');
  }
  return `<div class="topbar"><div><h1>Verwaltung</h1><p>Dokumente, Verträge, Versicherungen und rechtliche Vorgänge mit ihren Fristen.</p></div></div>${tb.html}${body}`;

function shopHist(){return (S.hh&&S.hh.shopHistory)||{}}
function deptOf(name){const h=shopHist()[shopKey(name)];if(h&&h.cat)return h.cat;for(const [re,c] of DEPT_RULES)if(re.test(name))return c;return 'Sonstiges'}

function exHist(name,before){const out={last:null,best:0};const ws=[...S.workouts].filter(w=>w.date<before).sort((a,b)=>a.date<b.date?1:-1);
  for(const w of ws){const e=Object.entries(w.ex||{}).find(([k,v])=>(v.swap||k)===name);if(!e)continue;const sets=(e[1].sets||[]).filter(x=>x&&(x.r!=null||x.kg!=null));if(!sets.length)continue;if(!out.last)out.last={date:w.date,sets};sets.forEach(x=>{if(+x.kg>out.best)out.best=+x.kg})}
  return out}
let restT=null,restEnd=0;
function restStart(sec){restEnd=Date.now()+sec*1000;clearInterval(restT);restTick();restT=setInterval(restTick,250)}
function restTick(){let el=document.getElementById('restPill');const left=Math.ceil((restEnd-Date.now())/1000);
  if(left<=0){clearInterval(restT);if(el){el.remove();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}toast('Pause vorbei')}return}
  if(!el){el=document.createElement('div');el.id='restPill';el.className='restpill';el.setAttribute('role','timer');document.body.appendChild(el)}
  el.innerHTML=`<span>Pause</span><b class="num">${Math.floor(left/60)}:${pad(left%60)}</b><button data-rest="+15">+15 s</button><button data-reststop>Stopp</button>`}

function weekNumbers(){
  const now=new Date();const day=(now.getDay()+6)%7;const mon=new Date(now);mon.setDate(now.getDate()-day);const from=iso(mon),to=TODAY();
  const tx=S.transactions.filter(x=>x.date>=from&&x.date<=to&&x.category!=='Umbuchung'&&(x.entity||'Privat')==='Privat');
  return [`Ausgaben privat: ${eur.format(Math.abs(sum(tx.filter(x=>+x.amount<0),x=>x.amount)))}`,`Trainingseinheiten: ${S.workouts.filter(w=>w.date>=from&&w.date<=to).length}`,`Mails erledigt: ${S.mails.filter(m=>m.status==='erledigt'&&(m.updatedAt||'').slice(0,10)>=from).length}`,`Reminder erledigt: ${S.reminders.filter(r=>r.status==='erledigt'&&(r.updatedAt||'').slice(0,10)>=from).length}`,`Nettovermögen: ${eur.format(calc().net)}`].join('\n');
}

// ---------- Einstellungen ----------
const LIST_META=[['ent','Gesellschaften, Objekte & Bereiche','Zuordnung für Konten, Buchungen, Rechnungen, Verträge, Pflichten und To-Do-Listen. „Privat“ ist fest.',['entity','area']],['areas','Weitere To-Do-Listen','Zusätzlich zu den Bereichen oben.',['area']],['cats','Kategorien','Für Buchungen, Budgets und Planpositionen.',['category']],['tax','Steuer-Zuordnungen','Für Buchungen, Rechnungen und Dokumente; Grundlage des Steuerordners und des Steuerberater-Pakets.',['taxTag']]];
function listCurrent(key){const l=(S.settings&&S.settings.lists)||{};return key==='areas'?(Array.isArray(l.areas)?l.areas:DEF_LISTS.areas):(Array.isArray(l[key])&&l[key].length?l[key]:DEF_LISTS[key])}
function applyLists(){const set=(arr,v)=>{if(arr.length!==v.length||arr.some((x,i)=>x!==v[i]))arr.splice(0,arr.length,...v)};set(ENT,listCurrent('ent'));set(CATS,listCurrent('cats'));set(TAX,listCurrent('tax'));set(AREAS,[...ENT,...listCurrent('areas').filter(a=>!ENT.includes(a))])}
const LIST_SKIP=new Set(['catrules']);
function listUsage(fields,v){let n=0;Object.keys(SCHEMA).forEach(k=>{if(k.startsWith('hh')||LIST_SKIP.has(k))return;(S[k]||[]).forEach(x=>{if(fields.some(f=>x[f]===v))n++})});return n}
async function saveList(key,arr){const st=S.settings||{};const lists={...(st.lists||{}),[key]:arr};S.settings={...st,lists};applyLists();render();try{await db.doc('settings/main').set({...st,lists,updatedAt:new Date().toISOString()})}catch(e){toast('Speichern fehlgeschlagen')}}
async function renameListValue(key,oldV,newV){
  const meta=LIST_META.find(m=>m[0]===key);const arr=[...listCurrent(key)];const i=arr.indexOf(oldV);if(i<0)return;arr[i]=newV;
  const st=S.settings||{};const extra={};
  if(key==='ent'&&st.reserve&&st.reserve[oldV]!=null){const r={...st.reserve};r[newV]=r[oldV];delete r[oldV];extra.reserve=r}
  const lists={...(st.lists||{}),[key]:arr};S.settings={...st,...extra,lists};applyLists();
  try{await db.doc('settings/main').set({...st,...extra,lists,updatedAt:new Date().toISOString()})}catch(e){toast('Speichern fehlgeschlagen');return}
  let n=0;for(const k of Object.keys(SCHEMA)){if(k.startsWith('hh'))continue;for(const x of (S[k]||[])){const p={};meta[3].forEach(f=>{if(x[f]===oldV)p[f]=newV});if(key==='cats'&&k==='catrules'&&x.category===oldV)p.category=newV;if(Object.keys(p).length){await patch(k,x.id,p);n++}}}
  toast(`Umbenannt${n?` · ${n} Einträge angepasst`:''}`);
}
function openListEdit(key,i){
  const meta=LIST_META.find(m=>m[0]===key);const arr=listCurrent(key);const v=arr[i];const used=listUsage(meta[3],v);const fixed=key==='ent'&&v==='Privat';
  document.getElementById('overlay').innerHTML=`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="Eintrag bearbeiten"><div class="panel-h"><h2>${esc(v)}</h2><button class="btn ghost" data-closesheet aria-label="Schließen">✕</button></div>
  <p class="sync" style="margin:0">${used?`Wird in ${used} Einträgen verwendet.`:'Wird noch nirgends verwendet.'}</p>
  ${fixed?'<p class="sync">„Privat“ ist die Standard-Zuordnung und kann nicht umbenannt oder entfernt werden.</p>':`<form id="lForm"><div class="field"><label for="lName">Bezeichnung</label><input id="lName" value="${esc(v)}" autocomplete="off"></div>
  <p class="sync">Beim Umbenennen werden alle ${used||''} Einträge mit umbenannt.</p>
  <div class="sheet-actions"><div class="tools"><span id="lDel"><button type="button" class="btn danger" data-ldelask>Entfernen</button></span></div><div class="tools"><button type="button" class="btn" data-closesheet>Abbrechen</button><button class="btn pri" type="submit">Speichern</button></div></div></form>`}</div></div>`;
  const f=document.getElementById('lForm');if(!f)return;
  f.addEventListener('submit',async e=>{e.preventDefault();const nv=document.getElementById('lName').value.trim();if(!nv||nv===v){closeSheet();return}if(arr.includes(nv)){toast('Diesen Eintrag gibt es schon');return}closeSheet();await renameListValue(key,v,nv)});
  f.querySelector('[data-ldelask]').addEventListener('click',()=>{document.getElementById('lDel').innerHTML=`<span class="confirm">${used?`${used} Einträge behalten den Wert.`:''} Entfernen? <button type="button" class="btn sm danger" id="lYes">Ja</button></span>`;document.getElementById('lYes').onclick=async()=>{closeSheet();await saveList(key,arr.filter((x,j)=>j!==i));toast('Entfernt')}});
}

async function openFile(id){if(!window.__fileUrl){window.open('/_blob/'+id,'_blank','noopener');return}const w=window.open('','_blank');try{const u=await window.__fileUrl(id);if(w)w.location.href=u;else location.href=u}catch(e){if(w)w.close();toast('Datei konnte nicht geöffnet werden')}}
async function uploadFile(file){if(!assetsApi)throw new Error('Hochladen nicht verfügbar');return await assetsApi.upload(file)}
function matchTx(inv){
  const amt=Math.abs(+inv.amount||0);if(!amt)return null;const sign=inv.kind==='Gutschrift'?1:-1;
  const iss=String(inv.issuer||inv.title||'').toLowerCase().split(/\s+/).filter(w=>w.length>3)[0]||'';
  const ref=inv.due||TODAY();
  const c=S.transactions.filter(x=>!x.invoiceId&&Math.sign(+x.amount)===sign&&Math.abs(Math.abs(+x.amount)-amt)<=Math.max(0.5,amt*0.005)&&Math.abs((parseD(x.date)-parseD(ref))/864e5)<=45);
  c.sort((a,b)=>{const ia=iss&&String(a.counterparty||'').toLowerCase().includes(iss)?0:1,ib=iss&&String(b.counterparty||'').toLowerCase().includes(iss)?0:1;return ia-ib||Math.abs(parseD(a.date)-parseD(ref))-Math.abs(parseD(b.date)-parseD(ref))});
  return c[0]||null;
}
async function linkInvoice(invId,txId){await patch('invoices',invId,{status:'bezahlt',txId,paidAt:TODAY()});await patch('transactions',txId,{invoiceId:invId});toast('Mit Buchung verknüpft')}

const catKey=s=>String(s||'').toLowerCase().replace(/[0-9]/g,'').replace(/[^a-zäöüß ]/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,3).join(' ');

async function learnCategory(cp,cat,exceptId){
  const k=catKey(cp);if(!k||!db)return;const rid='r'+hashId(k).slice(2);
  try{await db.collection('catrules').doc(rid).set({key:k,category:cat,label:cp,updatedAt:new Date().toISOString()})}catch(e){return}
  const others=S.transactions.filter(x=>x.id!==exceptId&&!x.catManual&&x.category!==cat&&catKey(x.counterparty)===k).slice(0,200);
  for(const x of others)await patch('transactions',x.id,{category:cat});

}

// ---------- CSV-Import ----------
function splitCSV(text){
  const lines=text.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());const head=lines.slice(0,15).join('\n');
  const delim=head.split(';').length>head.split(',').length?';':',';
  const parse=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===delim&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(s=>s.trim())};
  return lines.map(parse);
}
const norm=s=>s.toLowerCase().replace(/[^a-zäöüß/ ]/g,'').trim();
function findCol(h,names){for(const n of names){const i=h.findIndex(x=>norm(x)===n);if(i>=0)return i}for(const n of names){const i=h.findIndex(x=>norm(x).includes(n));if(i>=0)return i}return -1}
function pAmount(s){if(s==null)return NaN;s=String(s).replace(/[−–]/g,'-').replace(/[€\sA-Za-z]/g,'');const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');if(lc>ld)s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');return parseFloat(s)}
function pDate(s){s=String(s||'').trim();let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${pad(m[2])}-${pad(m[1])}`}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;return null}
function guessCat(t,cp){const r=cp!=null&&ruleCat(cp);if(r)return r;for(const [re,c] of CAT_RULES)if(re.test(t))return c;return 'Sonstiges'}
function guessTax(ent,amt){if(ent==='Stockkampstraße')return 'Anlage V Stockkampstraße';if(ent==='JPL Capital UG')return amt>0?'Betriebseinnahme':'Betriebsausgabe JPL Capital UG';if(ent==='Lestate Real')return amt>0?'Betriebseinnahme':'Betriebsausgabe Lestate';return null}
function hashId(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return 'tx'+(h>>>0).toString(36)}
async function runImport(file){
  const out=document.getElementById('impOut');const accId=document.getElementById('impAcc').value;const acc=S.accounts.find(a=>a.id===accId);
  if(!acc){out.innerHTML='<div class="banner">Bitte zuerst ein Konto auswählen.</div>';return}
  const rows=splitCSV(await file.text());
  const hi=rows.findIndex(r=>{const n=r.map(norm);return n.some(x=>/datum|date|buchung/.test(x))&&n.some(x=>/betrag|amount|umsatz/.test(x))});
  if(hi<0){out.innerHTML='<div class="banner">Keine Kopfzeile mit Datum und Betrag gefunden. Prüfe, ob es der CSV-Umsatzexport ist.</div>';return}
  const h=rows[hi];
  const cDate=findCol(h,['buchungstag','buchung','buchungsdatum','datum','completed date','started date','date']);
  const cAmt=findCol(h,['betrag','amount','umsatz','betrag eur']);
  const cCp=findCol(h,['beguenstigter/zahlungspflichtiger','begünstigter/zahlungspflichtiger','auftraggeber/empfänger','zahlungsempfänger','empfänger','name','description']);
  const cPur=findCol(h,['verwendungszweck','buchungstext','reference','description']);
  const cState=findCol(h,['state']);
  if(cDate<0||cAmt<0){out.innerHTML='<div class="banner">Datums- oder Betragsspalte nicht erkannt.</div>';return}
  const existing=new Set(S.transactions.map(t=>t.id));const items=[];let skipped=0;
  rows.slice(hi+1).forEach(r=>{const date=pDate(r[cDate]);const amount=pAmount(r[cAmt]);if(!date||isNaN(amount))return;if(cState>=0&&/reverted|declined|failed/i.test(r[cState]||''))return;
    const cp=cCp>=0?r[cCp]:'';const pur=cPur>=0&&cPur!==cCp?r[cPur]:'';const id=hashId([acc.id,date,amount.toFixed(2),cp,pur].join('|'));
    if(existing.has(id)){skipped++;return}existing.add(id);const ent=acc.entity||'Privat';
    items.push({id,date,amount:Math.round(amount*100)/100,counterparty:cp||null,purpose:pur||null,category:guessCat(cp+' '+pur,cp),entity:ent,account:acc.name,taxTag:guessTax(ent,amount),source:'CSV '+file.name})});
  if(!items.length){out.innerHTML=`<div class="banner">Keine neuen Buchungen gefunden${skipped?` (${skipped} bereits vorhanden)`:''}.</div>`;return}
  out.dataset.busy='1';out.innerHTML=`<p class="sync">Importiere ${items.length} Buchungen …</p>`;
  let n=0;const now=new Date().toISOString();
  for(const it of items){const {id,...d}=it;try{await db.collection('transactions').doc(id).set({...d,createdAt:now,updatedAt:now});n++;if(n%25===0)out.innerHTML=`<p class="sync">${n} von ${items.length} importiert …</p>`}catch(e){out.innerHTML=`<div class="banner bad">Import nach ${n} Buchungen abgebrochen: ${esc(e.message||e.code)}</div>`;delete out.dataset.busy;return}}
  let linked=0;for(const inv of S.invoices.filter(v=>v.status==='offen')){const it=items.find(x=>{const amt=Math.abs(+inv.amount||0);return amt&&Math.sign(x.amount)===(inv.kind==='Gutschrift'?1:-1)&&Math.abs(Math.abs(x.amount)-amt)<=Math.max(0.5,amt*0.005)});if(it){await patch('invoices',inv.id,{status:'bezahlt',txId:it.id,paidAt:it.date});await patch('transactions',it.id,{invoiceId:inv.id});linked++}}
  const last=items.map(i=>i.date).sort().pop();delete out.dataset.busy;
  out.innerHTML=`<div class="banner ok">${n} Buchungen importiert${skipped?`, ${skipped} Duplikate übersprungen`:''}. Letzte Buchung vom ${fd(last)}.${linked?` ${linked} offene Rechnungen als bezahlt verknüpft.`:''} Trage den aktuellen Saldo unter „Konten“ ein.</div>`;
}

function parseReceiptText(txt){
  const lines=String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean);const amts=[];
  lines.forEach((l,i)=>{const key=/summe|gesamt|total|zu zahlen|endbetrag|rechnungsbetrag|brutto/i.test(l);const re=/(\d{1,3}(?:[.\s]\d{3})*,\d{2}|\d+[.,]\d{2})(?!\d)/g;let m;while((m=re.exec(l))){const v=pAmount(m[1]);if(!isNaN(v)&&v>0&&v<1e6)amts.push({v,key})}});
  const keyed=amts.filter(a=>a.key).sort((a,b)=>b.v-a.v);const pick=keyed[0]||[...amts].sort((a,b)=>b.v-a.v)[0];
  const dt=m=>{if(!m)return null;const y=m[3].length===2?'20'+m[3]:m[3];const d=`${y}-${pad(m[2])}-${pad(m[1])}`;const p=parseD(d);return p&&!isNaN(p)&&+m[2]<=12&&+m[1]<=31?d:null};
  const due=dt(String(txt).match(/(?:fällig|zahlbar bis|zahlungsziel|bis zum)[^\d]{0,20}(\d{1,2})\.(\d{1,2})\.(\d{2,4})/i));
  const date=dt(String(txt).match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{4}|\d{2})(?!\d)/));
  const vendor=((lines.find(l=>/[A-Za-zÄÖÜäöüß]{3,}/.test(l)&&!/rechnung|beleg|quittung|kassenbon|bon|datum|seite/i.test(l))||'').replace(/[^\wÄÖÜäöüß&.\- ]/g,' ').replace(/\s+/g,' ').trim().slice(0,40))||null;
  const invoiceNo=(String(txt).match(/rechnungs?\s*-?\s*(?:nr|nummer)\.?\s*:?\s*([A-Z0-9][A-Z0-9\-\/]{2,})/i)||[])[1]||null;

}
