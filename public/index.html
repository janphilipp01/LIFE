  const hb=t.closest('[data-habit]');if(hb){e.stopPropagation();if(!db)return;const d=hb.dataset.day;const l=S.habitlog.find(x=>x.date===d);const done={...((l&&l.done)||{})};if(done[hb.dataset.habit])delete done[hb.dataset.habit];else done[hb.dataset.habit]=true;try{await db.collection('habitlog').doc(d).set({date:d,done})}catch(err){toast('Speichern fehlgeschlagen')}return}
  const ct=t.closest('[data-contact]');if(ct){e.stopPropagation();await patch('people',ct.dataset.contact,{lastContact:TODAY()});toast('Kontakt vermerkt');return}
  const hd=t.closest('[data-hhdone]');if(hd){e.stopPropagation();await hhDone(hd.dataset.hhdone);return}
  const du=t.closest('[data-duty]');if(du){e.stopPropagation();await dutyDone(du.dataset.duty);return}
  const sh=t.closest('[data-shop]');if(sh){e.stopPropagation();await patch('hhShop',sh.dataset.shop,{done:sh.dataset.done!=='1'});return}
  const sad=t.closest('[data-shopadd]');if(sad){const n=sad.dataset.shopadd;await save('hhShop',null,{item:n,qty:null,category:deptOf(n),done:false});shopLearn([n]);return}
  if(t.closest('[data-shopclear]')){for(const s of S.hhShop.filter(x=>x.done))await del('hhShop',s.id);return}
  if(t.closest('[data-settings]')){openSettings();return}
  if(t.closest('[data-hhnames]')){openNames();return}
  if(t.closest('[data-snapshot]')){await snapshot();return}
  if(t.closest('[data-hhsettle]')){const bal=hhBalance();const debtor=bal>0?'b':'a';const cred=debtor==='a'?'b':'a';await save('hhExp',null,{date:TODAY(),title:'Ausgleich',amount:Math.round(Math.abs(bal)*100)/100,paidBy:debtor,split:cred,category:'Ausgleich'});toast('Ausgleich erfasst');return}
  if(t.closest('[data-review]')){const id=weekId(new Date());try{await db.collection('reviews').doc(id).set({week:id,wins:'',misses:'',numbers:weekNumbers(),focus:'',source:'manuell',updatedAt:new Date().toISOString()});openEdit('reviews',id)}catch(err){toast('Speichern fehlgeschlagen')}return}
  if(t.closest('[data-taxauto]')){const y=ui.tab.taxYear||TODAY().slice(0,4);const xs=S.transactions.filter(x=>(x.date||'').startsWith(y)&&!x.taxTag&&guessTax(x.entity,+x.amount));for(const x of xs)await patch('transactions',x.id,{taxTag:guessTax(x.entity,+x.amount)});toast(xs.length+' Buchungen zugeordnet');return}
  const ts=t.closest('[data-taxsel]');if(ts){ui.tab.taxTag=ui.tab.taxTag===ts.dataset.taxsel?'':ts.dataset.taxsel;render();return}
  if(t.closest('[data-scrun]')){ui.scen={amount:document.getElementById('scAmt').value,monthly:document.getElementById('scMon').value,date:document.getElementById('scDate').value||TODAY(),entity:ui.tab.scEnt||'Alle'};render();return}
  if(t.closest('[data-scsave]')){const d=ui.scen||{};openEdit('scenarios',null,{title:'Ausgabe '+(d.amount?eur.format(+d.amount):''),entity:d.entity==='Alle'?'Privat':d.entity,oneOff:d.amount?-Math.abs(+d.amount):null,oneOffDate:d.date,monthly:d.monthly?-Math.abs(+d.monthly):null,start:d.date,active:'nein'});return}
  const wd=t.closest('[data-wday]');if(wd){const n=+wd.dataset.wday;ui.wdate=n===0?TODAY():addDays(ui.wdate||TODAY(),n);ui.draft=null;render();return}
  const wo=t.closest('[data-wopen]');if(wo){ui.wdate=wo.dataset.wopen;ui.draft=null;ui.tab.tr='heute';render();window.scrollTo(0,0);return}
  const exd=t.closest('[data-exdone]');if(exd){const k=exKey(+exd.dataset.exdone);const e0=ui.draft.ex[k]=ui.draft.ex[k]||{};e0.done=!e0.done;if(e0.done&&!woFor(ui.draft.date).items.every(it=>(ui.draft.ex[it.n]||{}).done))restStart(90);render();return}
  const exl=t.closest('[data-exlast]');if(exl){const k=exKey(+exl.dataset.exlast);const e0=ui.draft.ex[k]=ui.draft.ex[k]||{};const h=exHist(e0.swap||k,ui.draft.date);if(h.last)e0.sets=h.last.sets.map(x=>({r:x.r??null,kg:x.kg??null}));render();return}
  const as=t.closest('[data-addset]');if(as){const k=exKey(+as.dataset.addset);const w=woFor(ui.draft.date).items[+as.dataset.addset];const e0=ui.draft.ex[k]=ui.draft.ex[k]||{};e0.sets=e0.sets||[];const base=typeof w.s==='number'?w.s:3;while(e0.sets.length<base)e0.sets.push({});e0.sets.push({});render();return}
  if(t.closest('[data-wsave]')){await saveWorkout();return}
  if(t.closest('[data-wdel]')){const b=t.closest('[data-wdel]');if(b.dataset.sure){await db.collection('workouts').doc(ui.draft.date).delete();ui.draft=null;toast('Log gelöscht')}else{b.dataset.sure='1';b.textContent='Wirklich löschen?'}return}
  const tsel=t.closest('[data-tripsel]');if(tsel){ui.tab.trip=tsel.dataset.tripsel;saveUi();render();return}
  const pk=t.closest('[data-pack]');if(pk){const tr=S.trips.find(x=>x.id===pk.dataset.trip);const p=[...(tr.packing||[])].map(x=>({...x}));p[+pk.dataset.pack].done=!p[+pk.dataset.pack].done;await patch('trips',tr.id,{packing:p});return}
  const pd=t.closest('[data-packdel]');if(pd){const tr=S.trips.find(x=>x.id===pd.dataset.trip);const p=[...(tr.packing||[])];p.splice(+pd.dataset.packdel,1);await patch('trips',tr.id,{packing:p});return}
  const np=t.closest('[data-newp]');if(np){let pre={};try{pre=JSON.parse(np.dataset.preset||'{}')}catch(err){}openEdit(np.dataset.newp,null,pre);return}
  const nw=t.closest('[data-new]');if(nw){openEdit(nw.dataset.new,null);return}
  const ed=t.closest('[data-edit]');if(ed){openEdit(ed.dataset.edit,ed.dataset.id);return}
});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&String(e.key).toLowerCase()==='k'){e.preventDefault();openSearch();return}if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&e.target.matches('.row,.card,[data-go][role="button"]')){e.target.click()}});
window.addEventListener('pagehide',()=>{if(ui.jdraft&&ui.jdraft.dirty)jSave()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='moneyToggle'||t.id==='moneyToggle2'){ui.showMoney=t.checked;render();return}
  if(t.dataset.sel){ui.tab[t.dataset.sel]=t.value;saveUi();render();return}
  if(t.dataset.swap!=null&&ui.draft){const k=exKey(+t.dataset.swap);const e0=ui.draft.ex[k]=ui.draft.ex[k]||{};if(t.value)e0.swap=t.value;else delete e0.swap;render();return}
  if(t.id==='impFile'&&t.files[0]){runImport(t.files[0])}
  if(t.dataset.pset){const [dk,i,f]=t.dataset.pset.split(':');const wo=ui.tab.trWo||(isoWeek(new Date()).w%2===0?'1':'2');const val=tpNum(t.value);tpEdit(v=>{const it=v.plan[wo][dk][+i];if(it)it[f]=val});return}
  if(t.dataset.pfocus){const dk=t.dataset.pfocus;const val=t.value.trim();tpEdit(v=>{v.focus[dk]=val});return}
  if(t.dataset.receipt&&t.files&&t.files[0]){const f=t.files[0];t.value='';scanReceipt(f,t.dataset.receipt);return}
  if(t.dataset.set){render();return}
});
let qT;document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.q){ui.q[t.dataset.q]=t.value;clearTimeout(qT);qT=setTimeout(render,150);return}
  if(t.dataset.set&&ui.draft){const [i,j,f]=t.dataset.set.split(':');const k=exKey(+i);const e0=ui.draft.ex[k]=ui.draft.ex[k]||{};e0.sets=e0.sets||[];while(e0.sets.length<=+j)e0.sets.push({});e0.sets[+j][f]=t.value===''?null:+t.value;return}
  if(t.dataset.wnote!=null&&ui.draft){ui.draft.note=t.value;return}
  if(t.dataset.jf&&ui.jdraft){ui.jdraft[t.dataset.jf]=t.value;ui.jdraft.dirty=true;const st=document.getElementById('jState');if(st)st.textContent='Ungesicherte Änderungen';jSchedule();return}
  if(t.dataset.wrpe!=null&&ui.draft){ui.draft.rpe=t.value;return}
});
document.addEventListener('submit',async e=>{
  if(e.target.id==='todoForm'){e.preventDefault();const raw=document.getElementById('todoTitle').value.trim();if(!raw)return;const q=parseQuick(raw);if(!q.title)return;const dv=document.getElementById('todoDue').value;await save('reminders',null,{title:q.title,due:q.due||dv||null,priority:q.priority,area:e.target.dataset.area||null,flagged:ui.tab.todo==='markiert'?'ja':'nein',status:'offen'});toast('To-Do angelegt');return}
  if(e.target.dataset&&e.target.dataset.ladd){e.preventDefault();const key=e.target.dataset.ladd;const v=e.target.elements.v.value.trim();if(!v)return;const arr=listCurrent(key);if(arr.includes(v)){toast('Diesen Eintrag gibt es schon');return}await saveList(key,[...arr,v]);toast('Hinzugefügt');return}
  if(e.target.id==='shopForm'){e.preventDefault();const raw=document.getElementById('shopItem').value.trim();if(!raw)return;const qIn=document.getElementById('shopQty').value.trim();const parts=raw.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);const names=[];document.getElementById('shopItem').value='';document.getElementById('shopQty').value='';
    for(const p of parts){let item=p,qty=parts.length===1?qIn:'';const m=p.match(/^(\d+[.,]?\d*\s?(?:x|×|g|kg|l|ml|st|stk|pck)?)\s+(.+)$/i);if(m){qty=m[1];item=m[2]}await save('hhShop',null,{item,qty:qty||null,category:deptOf(item),done:false});names.push(item)}
    shopLearn(names);return}
  if(e.target.id==='packForm'){e.preventDefault();const it=document.getElementById('packItem').value.trim();if(!it)return;const tr=S.trips.find(x=>x.id===e.target.dataset.trip);await patch('trips',tr.id,{packing:[...(tr.packing||[]),{t:it,done:false}]});return}
});

// Drag & Drop im Wochenplan
let dragSrc=null;
document.addEventListener('dragstart',e=>{const a=e.target.closest&&e.target.closest('[data-pdrag],[data-libn]');if(!a)return;dragSrc=a.dataset.libn?{lib:a.dataset.libn}:{dk:a.dataset.pdrag.split(':')[0],i:+a.dataset.pdrag.split(':')[1]};try{e.dataTransfer.setData('text/plain',JSON.stringify(dragSrc));e.dataTransfer.effectAllowed='move'}catch(err){}a.classList.add('dragging')});
document.addEventListener('dragend',e=>{document.querySelectorAll('.dragging,.dropover').forEach(x=>x.classList.remove('dragging','dropover'));dragSrc=null});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-pdrop]');if(!z||!dragSrc)return;e.preventDefault();document.querySelectorAll('.dropover').forEach(x=>x!==z&&x.classList.remove('dropover'));z.classList.add('dropover')});
document.addEventListener('drop',async e=>{const z=e.target.closest&&e.target.closest('[data-pdrop]');if(!z||!dragSrc)return;e.preventDefault();const src=dragSrc;dragSrc=null;z.classList.remove('dropover');
  const dk=z.dataset.pdrop;const wo=ui.tab.trWo||(isoWeek(new Date()).w%2===0?'1':'2');const row=e.target.closest('[data-pdrag]');let idx=row&&row.dataset.pdrag.split(':')[0]===dk?+row.dataset.pdrag.split(':')[1]:null;
  if(row&&idx!=null){const r=row.getBoundingClientRect();if(e.clientY>r.top+r.height/2)idx++}
  await tpEdit(v=>{const a=v.plan[wo][dk];let item;if(src.lib)item={n:src.lib,s:3,r:'8'};else{const from=v.plan[wo][src.dk];item=from.splice(src.i,1)[0];if(!item)return;if(src.dk===dk&&idx!=null&&src.i<idx)idx--}if(idx==null||idx>a.length)idx=a.length;a.splice(idx,0,item)})});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(SECS.includes(h)&&h!==ui.sec){ui.sec=h;render()}});
setInterval(()=>{if(!document.getElementById('overlay').innerHTML&&loaded&&!(document.activeElement&&document.activeElement.matches('input,textarea,select')))render()},5*60*1000);

boot();
