<title>Jan Life OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: realaize UI Framework (HIG für Web). Seitenleiste 240px aus Sekundär-Glas, ab <1024px nur Symbole (68px), unter 768px Tab-Leiste unten. Inhalt auf secondarySystemBackground, Karten als Primär-Oberfläche mit 16px Radius, Segmente für Reiter. Signatur: Tagesringe auf „Heute“. */
:root{
  /* System-Farben (Framework 2.1) */
  --blue:#007AFF; --green:#34C759; --indigo:#5856D6; --orange:#FF9500; --pink:#FF2D55; --purple:#AF52DE; --red:#FF3B30; --teal:#5AC8FA; --yellow:#FFCC00;
  /* Rollen */
  --bg:#F2F2F7; --surface:rgba(255,255,255,.80); --surface-solid:#FFFFFF; --side:rgba(246,246,246,.85); --elev:rgba(255,255,255,.92);
  --fg:#000000; --muted:rgba(60,60,67,.75); --faint:rgba(60,60,67,.30); --quat:rgba(60,60,67,.18);
  --fill:rgba(118,118,128,.12); --fill2:rgba(120,120,128,.16); --fill4:rgba(116,116,128,.08);
  --sep:rgba(60,60,67,.29); --sep-soft:rgba(60,60,67,.12); --hair:rgba(0,0,0,.10);
  --accent:#007AFF; --accent-btn:#0071E3; --accent-text:#0062CC; --accent-soft:rgba(0,122,255,.12); --on-accent:#FFFFFF; --accent2:#5856D6;
  --good:#1F7A36; --warn:#C93400; --bad:#D70015; --good-soft:rgba(52,199,89,.12); --warn-soft:rgba(255,149,0,.12); --bad-soft:rgba(255,59,48,.10);
  --ring1:#007AFF; --ring2:#5856D6; --ring3:#FF2D55;
  --sh1:0 1px 3px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.04); --sh2:0 4px 16px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.06); --sh3:0 24px 80px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --r:16px; --r-btn:12px; --r-in:10px; --r-badge:6px;
  --fs:15px; --fs-sub:13px; --fs-foot:12px; --row:44px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --blue:#0A84FF; --green:#30D158; --indigo:#5E5CE6; --orange:#FF9F0A; --pink:#FF375F; --red:#FF453A;
  --bg:#000000; --surface:rgba(28,28,30,.80); --surface-solid:#1C1C1E; --side:rgba(28,28,30,.85); --elev:rgba(44,44,46,.92);
  --fg:#FFFFFF; --muted:rgba(235,235,245,.60); --faint:rgba(235,235,245,.30); --quat:rgba(235,235,245,.18);
  --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.32); --fill4:rgba(116,116,128,.18);
  --sep:rgba(84,84,88,.65); --sep-soft:rgba(84,84,88,.35); --hair:rgba(255,255,255,.10);
  --accent:#0A84FF; --accent-btn:#0071E3; --accent-text:#409CFF; --accent-soft:rgba(10,132,255,.18); --accent2:#5E5CE6;
  --good:#30D158; --warn:#FF9F0A; --bad:#FF453A; --good-soft:rgba(48,209,88,.16); --warn-soft:rgba(255,159,10,.16); --bad-soft:rgba(255,69,58,.16);
  --ring1:#0A84FF; --ring2:#5E5CE6; --ring3:#FF375F;
  --sh1:0 0 0 .5px rgba(255,255,255,.08); --sh2:0 4px 16px rgba(0,0,0,.4),0 0 0 .5px rgba(255,255,255,.08); --sh3:0 24px 80px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.1);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --blue:#0A84FF; --green:#30D158; --indigo:#5E5CE6; --orange:#FF9F0A; --pink:#FF375F; --red:#FF453A;
  --bg:#000000; --surface:rgba(28,28,30,.80); --surface-solid:#1C1C1E; --side:rgba(28,28,30,.85); --elev:rgba(44,44,46,.92);
  --fg:#FFFFFF; --muted:rgba(235,235,245,.60); --faint:rgba(235,235,245,.30); --quat:rgba(235,235,245,.18);
  --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.32); --fill4:rgba(116,116,128,.18);
  --sep:rgba(84,84,88,.65); --sep-soft:rgba(84,84,88,.35); --hair:rgba(255,255,255,.10);
  --accent:#0A84FF; --accent-btn:#0071E3; --accent-text:#409CFF; --accent-soft:rgba(10,132,255,.18); --accent2:#5E5CE6;
  --good:#30D158; --warn:#FF9F0A; --bad:#FF453A; --good-soft:rgba(48,209,88,.16); --warn-soft:rgba(255,159,10,.16); --bad-soft:rgba(255,69,58,.16);
  --ring1:#0A84FF; --ring2:#5E5CE6; --ring3:#FF375F;
  --sh1:0 0 0 .5px rgba(255,255,255,.08); --sh2:0 4px 16px rgba(0,0,0,.4),0 0 0 .5px rgba(255,255,255,.08); --sh3:0 24px 80px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.1);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs);line-height:20px;letter-spacing:-.24px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;text-align:left}
h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px}
h2{font-size:20px;line-height:25px;font-weight:700;letter-spacing:.38px}
h3{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.41px}
.eyebrow{display:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
.num,.money{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.glass{background:var(--side);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
/* Seitenleiste (6.7) */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
nav.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 8px 12px max(8px,env(safe-area-inset-left,0px));border-right:.5px solid var(--hair);display:flex;flex-direction:column;gap:2px}
.brand{font-family:var(--display);font-weight:700;font-size:17px;line-height:22px;padding:10px 12px 14px;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:24px;height:24px;border-radius:7px;background:conic-gradient(var(--ring1) 0 34%,var(--ring2) 0 67%,var(--ring3) 0);flex:none}
.nav-group{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;cursor:pointer;font:600 12px/16px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px;text-align:left;border-radius:8px}
.nav-group:hover{color:var(--fg)}
.nav-group svg.i{width:16px;height:16px}
.nav-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:36px;text-align:left;border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--fg);font:400 13px/18px var(--font);letter-spacing:-.08px}
.nav-btn:hover{background:var(--fill4)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nav-btn .cnt{font:600 11px/13px var(--font);min-width:20px;padding:3px 6px;border-radius:var(--r-badge);background:var(--bad-soft);color:var(--bad);text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:12px 12px 0;font-size:var(--fs-foot);line-height:16px;color:var(--muted)}
main{min-width:0;padding-block:32px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.topbar p{margin:4px 0 0;color:var(--muted);max-width:70ch;font-size:15px;line-height:20px}
.mobile-top,.tabbar{display:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Buttons (6.1) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:0;background:var(--accent-soft);color:var(--accent-text);padding:10px 20px;border-radius:var(--r-btn);cursor:pointer;white-space:nowrap;font:600 15px/20px var(--font);letter-spacing:-.24px;transition:background .15s ease,opacity .1s ease}
.btn:hover{background:rgba(0,122,255,.18)}
.btn:active{opacity:.85}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent-btn);color:#fff}
.btn.pri:hover{opacity:.85;background:var(--accent-btn)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:rgba(0,122,255,.06)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:32px;padding:6px 12px;font-size:13px;line-height:18px;border-radius:9px;position:relative}
.btn.sm::after{content:"";position:absolute;inset:-6px 0}
:focus{outline:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible,.card:focus-visible,a:focus-visible,[role="button"]:focus-visible{box-shadow:0 0 0 4px rgba(0,122,255,.25);transition:box-shadow .15s ease}
/* Kennzahlen (6.5) */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:var(--r);padding:14px 18px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--sh1)}
.kpi .lbl{font:500 11px/13px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font:700 22px/28px var(--display);letter-spacing:.35px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .sub{font-size:var(--fs-sub);line-height:18px;color:var(--muted)}
.kpi.alert{background:var(--bad-soft)}
.kpi.alert .val{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:32px;flex-wrap:wrap}
/* Listen als Karten */
.list{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh1)}
.row{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;min-height:var(--row);padding:12px 16px;cursor:pointer;transition:background .15s ease}
.row+.row::before{content:"";position:absolute;top:0;left:46px;right:0;border-top:.5px solid var(--sep-soft)}
.row:hover{background:rgba(120,120,128,.04)}
.row .t{font-weight:400;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;line-height:18px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;font-size:13px;white-space:nowrap;color:var(--muted)}
.row .r .s{text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:var(--quat);margin-inline:7px}
.dot.bad{background:var(--red)}.dot.warn{background:var(--orange)}.dot.good{background:var(--green)}.dot.acc{background:var(--blue)}
/* Checkbox (6.11): 18px sichtbar, 44px Treffer */
.chk{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--sep);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;flex:none;font-size:12px;line-height:1;position:relative;color:#fff;margin-inline:3px}
.chk::after{content:"";position:absolute;inset:-13px}
.chk.on{background:var(--blue);border-color:var(--blue)}
/* Badges (6.6) */
.pill{display:inline-block;font:600 11px/13px var(--font);padding:3px 8px;border-radius:var(--r-badge);background:var(--fill4);color:var(--muted);white-space:nowrap;letter-spacing:.07px}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.good{background:var(--good-soft);color:var(--good)}.pill.acc{background:var(--accent-soft);color:var(--accent-text)}
/* Leerzustand (6.12) */
.empty{text-align:center;padding:40px 32px;color:var(--muted);font-size:15px;line-height:20px;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh1)}
/* Segmente (6.3) */
.tabs{display:inline-flex;gap:0;padding:2px;border-radius:9px;background:var(--fill);overflow-x:auto;align-self:flex-start;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:7px 16px;min-height:32px;cursor:pointer;color:var(--muted);border-radius:7px;white-space:nowrap;font:500 13px/18px var(--font);transition:background .2s ease,color .2s ease}
.tab[aria-selected="true"]{background:var(--surface-solid);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
:root[data-theme="dark"] .tab[aria-selected="true"]{background:#636366}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:#636366}}
/* Eingaben (6.2) */
.search,.inp{border:.5px solid transparent;background:var(--fill);border-radius:var(--r-in);padding:10px 14px;min-height:44px;min-width:0;max-width:100%;font-size:15px}
.search:focus,.inp:focus{background:var(--surface-solid);border-color:rgba(0,122,255,.5);box-shadow:0 0 0 4px rgba(0,122,255,.25)}
.search{width:260px}
::placeholder{color:var(--faint)}
/* Diagramme (6.14) */
.bars{display:flex;flex-direction:column;gap:12px;background:var(--surface);border-radius:var(--r);padding:20px;box-shadow:var(--sh1)}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 110px;gap:12px;align-items:center;font-size:13px}
.bar .track{height:6px;background:var(--fill4);border-radius:3px;position:relative}
.bar .fill{display:block;height:100%;background:var(--blue);border-radius:3px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.chart{background:var(--surface);border-radius:var(--r);padding:20px;overflow-x:auto;box-shadow:var(--sh1);display:flex!important;flex-direction:column-reverse;gap:12px}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.chart svg line{stroke-dasharray:3 3;stroke-width:.5}
.chart svg text{font-family:var(--font);font-size:12px}
.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;line-height:18px;color:var(--muted);padding:0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;cursor:pointer;min-width:0;box-shadow:var(--sh1);border:0;transition:box-shadow .15s ease}
.card:hover{box-shadow:var(--sh2)}
.card h3{font-size:17px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13px}
.card dt{color:var(--muted)}.card dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--fill4);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--blue);border-radius:3px}
.prog.over i{background:var(--red)}
/* Tabellen (6.4) */
.tblw{background:var(--surface);border-radius:var(--r);overflow-x:auto;box-shadow:var(--sh1)}
.tbl{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{padding:12px 16px;border-bottom:.5px solid var(--sep-soft);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tbody tr:hover td{background:rgba(120,120,128,.04)}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--surface-solid)}
.tbl thead th{font:500 12px/16px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px 16px;border-bottom:.5px solid var(--sep)}
.tbl tr.sum td{font-weight:600;background:rgba(118,118,128,.06);border-top:.5px solid var(--sep)}
.tbl tr.sum:last-child td{font:700 16px/20px var(--font);background:rgba(0,122,255,.06);color:var(--accent-text);border-top:1px solid var(--sep)}
.tbl td.neg{color:var(--bad)}
.cell-ok{color:var(--good)!important;font-weight:600}.cell-miss{color:var(--bad)!important;font-weight:600}.cell-part{color:var(--warn)!important;font-weight:600}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:16px;overflow-x:auto;padding-bottom:6px}
.kcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.kcol h3,.agenda-day h3{font:600 12px/16px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.agenda-day{display:flex;flex-direction:column;gap:8px}
.banner{padding:12px 16px;border-radius:var(--r-btn);background:var(--warn-soft);color:var(--fg);font-size:15px;line-height:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner::before{content:"!";display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;font-size:12px;flex:none}
.banner.ok{background:var(--good-soft)}.banner.ok::before{content:"✓";background:var(--green)}
.banner.bad{background:var(--bad-soft)}.banner.bad::before{background:var(--red)}
.sync{font-size:var(--fs-foot);line-height:16px;color:var(--muted)}
.hide-money .money:not(.peek){filter:blur(7px);cursor:pointer;user-select:none}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--fg);min-height:32px}
.toggle input{width:18px;height:18px;accent-color:var(--blue)}
.quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--sh1)}
.quick .inp{flex:1 1 160px}
.ex{background:var(--surface);border-radius:var(--r);padding:16px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh1)}
.ex-h{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.ex-h .nm{font-weight:600;font-size:17px;display:flex;gap:12px;align-items:center;min-width:0}
.sets{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set{display:flex;gap:4px;align-items:center;font-size:var(--fs-foot);color:var(--muted)}
.set input{width:68px;border:0;background:var(--fill);border-radius:var(--r-in);padding:8px 10px;min-height:44px;font-size:15px;font-variant-numeric:tabular-nums}
/* Tagesringe */
.rings{display:flex;gap:28px;align-items:center;background:var(--surface);border-radius:var(--r);padding:20px 24px;box-shadow:var(--sh1);flex-wrap:wrap}
.rings svg{width:132px;height:132px;flex:none}
.rings .rg{fill:none;stroke-width:12;stroke-linecap:round}
.rings .bgring{stroke:var(--fill)}
.rings .leg{display:flex;flex-direction:column;gap:10px;min-width:0}
.rings .leg div{display:flex;flex-direction:column;min-height:44px;justify-content:center}
.rings .leg b{font:700 22px/28px var(--display);font-variant-numeric:tabular-nums}
.rings .leg span{font:500 11px/13px var(--font);letter-spacing:.04em;text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){.rings .fg{animation:ringin .9s cubic-bezier(.32,.72,0,1)}@keyframes ringin{from{stroke-dashoffset:var(--full)}}}
/* Smart-Listen */
.smart{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.smart button{background:var(--surface);border:0;border-radius:var(--r);padding:14px 16px;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:8px 10px;box-shadow:var(--sh1);transition:box-shadow .15s ease}
.smart button:hover{box-shadow:var(--sh2)}
.smart button .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c)}
.smart button .ic svg.i{width:16px;height:16px}
.smart button .n{font:700 22px/28px var(--display);text-align:right;font-variant-numeric:tabular-nums}
.smart button .l{grid-column:1/3;font:600 13px/18px var(--font);color:var(--muted)}
.smart button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--blue)}
.flag{color:var(--orange)}
.prio{color:var(--bad);font-weight:700;margin-right:4px}
/* Journal */
.jour{background:var(--surface);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--sh1)}
.jour textarea{border:.5px solid transparent;background:var(--fill);border-radius:var(--r-in);padding:12px 14px;min-height:140px;resize:vertical;width:100%;font:400 17px/22px var(--font);letter-spacing:-.41px}

/* Toast (6.10) */
.toast{position:fixed;top:calc(24px + env(safe-area-inset-top,0px));right:max(24px,env(safe-area-inset-right,0px));background:var(--elev)!important;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:14px;padding:12px 20px;font:500 13px/18px var(--font);z-index:2000;box-shadow:0 8px 32px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.06);color:var(--fg)}

/* ===== Minimal Glass: nur Überschriften in SF Pro Display, alles andere SF Pro Text; mehr Luft, Glas auf ruhigem Farbgrund ===== */
:root{
  --font:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --display:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --glass-card:rgba(255,255,255,.58); --glass-edge:rgba(255,255,255,.75); --glass-line:rgba(0,0,0,.05);
  --glass-shadow:0 1px 1px rgba(0,0,0,.02),0 12px 40px rgba(31,38,64,.06);
  --wash-1:rgba(0,122,255,.10); --wash-2:rgba(88,86,214,.07); --wash-3:rgba(52,199,89,.06);
  --surface:var(--glass-card);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --glass-card:rgba(28,28,32,.52); --glass-edge:rgba(255,255,255,.09); --glass-line:rgba(255,255,255,.06);
  --glass-shadow:0 12px 40px rgba(0,0,0,.35);
  --wash-1:rgba(10,132,255,.16); --wash-2:rgba(94,92,230,.12); --wash-3:rgba(48,209,88,.07);
  --surface:var(--glass-card)}}
:root[data-theme="dark"]{
  --glass-card:rgba(28,28,32,.52); --glass-edge:rgba(255,255,255,.09); --glass-line:rgba(255,255,255,.06);
  --glass-shadow:0 12px 40px rgba(0,0,0,.35);
  --wash-1:rgba(10,132,255,.16); --wash-2:rgba(94,92,230,.12); --wash-3:rgba(48,209,88,.07);
  --surface:var(--glass-card)}
body{font-family:var(--font);background-color:var(--bg);background-image:radial-gradient(60vw 60vw at 85% -10%,var(--wash-1),transparent 60%),radial-gradient(50vw 50vw at -10% 40%,var(--wash-2),transparent 60%),radial-gradient(45vw 45vw at 70% 110%,var(--wash-3),transparent 60%);background-attachment:fixed}
/* Schrift: Display nur für Überschriften */
h1,h2,h3,.sheet h2,.rz-modal__title{font-family:var(--display)}
.kpi .val,.rings .leg b,.smart button .n,.prompt,.tbl tr.sum:last-child td,.kpi .lbl,.nav-group,.tabbar button,.btn,.tab,.pill,.field label,.field input,.field select,.field textarea,.jour textarea,.scale button,.toast,.set input,.search,.inp{font-family:var(--font)}
.brand{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.2px}
h1{font-size:40px;line-height:46px;font-weight:700;letter-spacing:-.5px}

.kpi,.list,.card,.bars,.chart,.tblw,.ex,.quick,.rings,.smart button,.jour,.moodstrip,.empty{background:var(--glass-card);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:.5px solid var(--glass-edge);box-shadow:var(--glass-shadow);border-radius:22px}
.tbl th:first-child,.tbl td:first-child{background:transparent;position:static}

.glass{-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
/* Mehr Luft */
main{padding-block:56px 96px;padding-left:max(56px,env(safe-area-inset-left,0px));padding-right:max(56px,env(safe-area-inset-right,0px))}

.nav-group{padding:22px 14px 8px;font-weight:500;letter-spacing:.06em}
nav.side{padding:calc(28px + env(safe-area-inset-top,0px)) 14px 20px max(14px,env(safe-area-inset-left,0px));gap:3px}

.sheet-actions{background:transparent;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.field input,.field select,.field textarea{background:rgba(118,118,128,.08);border-radius:14px}

.prog,.bar .track{background:rgba(118,118,128,.12)}
@media (max-width:1023px){main{padding:0 32px 72px 32px}.mobile-top{margin-inline:-32px;padding-inline:32px}.wrap{gap:40px}}

/* ===== Einstellungen, Plan-Editor, Steuerpaket ===== */

/* ===== Paket 2: Kalender, Postfach, Projekte ===== */

.wkg{background:var(--glass-card);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:.5px solid var(--glass-edge);border-radius:22px;box-shadow:var(--glass-shadow);overflow:hidden}

.mealday{display:flex;flex-direction:column;gap:6px;padding:12px 10px;border-radius:18px;background:var(--glass-card);border:.5px solid var(--glass-edge);min-height:140px;min-width:0}
.mealday.today{box-shadow:inset 0 0 0 1.5px var(--fg)}.md-h{font-size:13px;color:var(--muted)}.md-h b{color:var(--fg)}
.mealit{display:flex;flex-direction:column;gap:2px;padding:7px 8px;border-radius:10px;background:color-mix(in srgb,var(--good,#34C759) 12%,transparent);cursor:pointer;font-size:13px}.mealit .t{font-weight:500}.mealit .btn{align-self:flex-start;padding:2px 8px;font-size:11.5px}
.fseg.sm button{padding:4px 10px;font-size:12px;min-height:26px}
.pts{display:flex;flex-direction:column;gap:10px}.ptsbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:rgba(118,118,128,.12)}.ptsbar i{display:block;height:100%}
@media (max-width:1023px){.mealweek{grid-template-columns:repeat(2,minmax(0,1fr))}}

function loanSim(l){

function deadlines(horizon=60){
  const out=[];const inH=(s,h=horizon)=>{const n=days(s);return n!=null&&n<=h};
  S.contracts.forEach(c=>{if(c.noticeBy&&inH(c.noticeBy)&&days(c.noticeBy)>=-7)out.push({date:c.noticeBy,title:`Kündigungsfrist: ${c.title}`,sub:c.provider||c.kind||'',coll:'contracts',id:c.id})});
  S.legal.forEach(l=>{if(l.status==='abgeschlossen')return;if(l.deadline&&inH(l.deadline))out.push({date:l.deadline,title:`Frist: ${l.title}`,sub:l.counterparty||'',coll:'legal',id:l.id});(l.timeline||[]).forEach(x=>{if(!x.done&&x.date&&['Frist','Termin'].includes(x.kind)&&x.date!==l.deadline&&inH(x.date)&&days(x.date)>=0)out.push({date:x.date,title:`${x.kind}: ${x.t}`,sub:l.title,coll:'legal',id:l.id})})});
  S.invoices.forEach(i=>{if(i.status==='offen'&&i.due&&inH(i.due))out.push({date:i.due,title:`Zahlung: ${i.title}`,sub:i.issuer||'',amount:i.amount,coll:'invoices',id:i.id})});
  S.duties.forEach(d=>{const dd=dutyDue(d);if(d.status!=='erledigt'&&dd&&inH(dd))out.push({date:dd,title:d.title+(d.extendedTo?' (verlängert)':''),sub:d.entity||'',coll:'duties',id:d.id});const ef=objectionDeadline(d);if(ef&&d.noticeCheck!=='korrekt'&&inH(ef)&&days(ef)>=0)out.push({date:ef,title:'Einspruchsfrist: '+d.title,sub:'Bescheid vom '+fd(d.noticeDate),coll:'duties',id:d.id})});
  S.loans.forEach(l=>{if(l.direction==='aufgenommen'&&l.fixedUntil){const w=addMonths(l.fixedUntil,-12);if(days(w)<=0&&days(l.fixedUntil)>0&&inH(w,horizon))out.push({date:TODAY(),title:'Anschlussfinanzierung vorbereiten: '+l.name,sub:'Zinsbindung endet '+fd(l.fixedUntil),coll:'loans',id:l.id})}});
  S.documents.forEach(d=>{if(d.validUntil&&inH(d.validUntil,Math.max(horizon,90)))out.push({date:d.validUntil,title:`Läuft ab: ${d.title}`,sub:d.category||'',coll:'documents',id:d.id})});
  S.loans.forEach(l=>{if(l.fixedUntil&&inH(l.fixedUntil,Math.max(horizon,180))&&days(l.fixedUntil)>=0)out.push({date:l.fixedUntil,title:`Zinsbindung endet: ${l.name}`,sub:l.lender||'',coll:'loans',id:l.id})});
  S.units.forEach(u=>{if(u.end&&inH(u.end,Math.max(horizon,60))&&days(u.end)>=0)out.push({date:u.end,title:`Mietende: ${u.unit} (${u.tenant||'–'})`,sub:u.property||'',coll:'units',id:u.id})});
  if(false)S.people.forEach(p=>{if(p.birthday){const b=parseD(p.birthday);const now=new Date();let nb=new Date(now.getFullYear(),b.getMonth(),b.getDate());if(days(iso(nb))<0)nb=new Date(now.getFullYear()+1,b.getMonth(),b.getDate());const n=days(iso(nb));if(n<=Math.min(horizon,30))out.push({date:iso(nb),title:`Geburtstag: ${p.name}`,sub:p.relation||'',coll:'people',id:p.id})}});
  return out.sort((a,b)=>a.date<b.date?-1:1);
}
function contactDue(){return S.people.filter(p=>p.cadence&&CAD_DAYS[p.cadence]).map(p=>({p,over:p.lastContact?(-days(p.lastContact))-CAD_DAYS[p.cadence]:999})).filter(x=>x.over>=0).sort((a,b)=>b.over-a.over)}
function rentStatus(u,k){
  const exp=+u.rent||0;if(!exp||u.status!=='vermietet')return null;
  if(u.start&&k<u.start.slice(0,7))return null;if(u.end&&k>u.end.slice(0,7))return null;
  const keys=[u.match,u.tenant&&u.tenant.split(/\s+/).pop()].filter(Boolean).map(s=>s.toLowerCase());
  const got=sum(S.transactions.filter(x=>(x.date||'').startsWith(k)&&+x.amount>0&&keys.some(m=>(String(x.counterparty||'')+' '+String(x.purpose||'')).toLowerCase().includes(m))),x=>x.amount);
  const curr=k===TODAY().slice(0,7), early=curr&&new Date().getDate()<=5;
  return {exp,got,st:got>=exp*.98?'ok':got>0?'part':early||k>TODAY().slice(0,7)?'pend':'miss'};
}

function hhKey(){const inc=S.hhInc;const a=sum(inc.filter(x=>x.person==='a'),x=>x.amount),b=sum(inc.filter(x=>x.person==='b'),x=>x.amount);return {a,b,shareA:a+b>0?a/(a+b):.5}}
function hhBalance(){let netA=0;S.hhExp.forEach(e=>{const amt=+e.amount||0;const sa=e.split==='half'?.5:e.split==='a'?1:e.split==='b'?0:(e.shareA!=null?+e.shareA:hhKey().shareA);const owedA=amt*sa;const paidA=e.paidBy==='a'?amt:0;netA+=paidA-owedA});return netA}
function hhTaskDue(t){if(t.repeat==='einmalig')return t.due||TODAY();const c=+t.cadence||7;return t.lastDone?addDays(t.lastDone,c):TODAY()}
function hhAssignee(t){if(t.who==='abwechselnd')return t.lastBy==='a'?'b':'a';return t.who}

function libList(){if(S.tplan&&Array.isArray(S.tplan.lib))return S.tplan.lib;const names=new Set(TP.lib);Object.values(TP.plan).forEach(w=>Object.values(w).forEach(d=>(d||[]).forEach(it=>names.add(it.n))));return [...names].map(n=>({n,tags:[]}))}

  ${name&&usedIn?'<p class="sync">Beim Umbenennen wird die Übung auch im Wochenplan umbenannt. Bereits geloggte Einheiten behalten den alten Namen.</p>':''}

function barsHTML(pairs,emptyMsg,opts={}){

  const max=Math.max(...pairs.map(p=>Math.max(Math.abs(p[1]),Math.abs(p[2]||0))))||1;

function niceTop(max){if(max<=0)return 1;const step=Math.pow(10,Math.floor(Math.log10(max)));return ([1,2,2.5,5,10].map(m=>m*step).find(v=>v*4>=max)||step*10)*4}
const kfmt=v=>Math.abs(v)>=1e6?nf1.format(v/1e6)+' Mio':Math.abs(v)>=1000?nf.format(Math.round(v/1000))+'k':nf.format(Math.round(v));
function lineChart(labels,series,opts={}){
  const vals=series.flatMap(s=>s.v.filter(x=>x!=null));if(opts.ref!=null)vals.push(opts.ref);
  let lo=Math.min(0,...vals),hi=Math.max(...vals,1);const span=niceTop(hi-lo);const step=span/4;lo=Math.floor(lo/step)*step;hi=lo+span;if(Math.max(...vals)>hi)hi+=step;
  const W=760,H=240,L=64,B=28,T=12,R=12,n=labels.length,x=i=>L+(n<=1?0:i*(W-L-R)/(n-1)),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Verlauf')}">`;
  for(let v=lo;v<=hi+1e-9;v+=step){s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${kfmt(v)}</text>`}
  if(opts.ref!=null)s+=`<line x1="${L}" x2="${W-R}" y1="${y(opts.ref)}" y2="${y(opts.ref)}" stroke="var(--bad)" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(opts.ref)-5}" text-anchor="end" font-size="11" fill="var(--bad)">${esc(opts.refLabel||'')}</text>`;
  labels.forEach((l,i)=>{if(n<=12||i%Math.ceil(n/12)===0)s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(l)}</text>`});
  series.forEach(se=>{const pts=se.v.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);if(!pts.length)return;
    if(se.area)s+=`<path d="M${pts[0][0]},${y(Math.max(lo,0))} ${pts.map(p=>'L'+p[0]+','+p[1]).join(' ')} L${pts[pts.length-1][0]},${y(Math.max(lo,0))} Z" fill="${se.c}" opacity=".12"/>`;
    s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${se.c}" stroke-width="2" ${se.dash?'stroke-dasharray="6 4"':''}/>`;
    const lp=pts[pts.length-1];s+=`<circle cx="${lp[0]}" cy="${lp[1]}" r="3.5" fill="${se.c}"/>`;
    se.v.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${x(i)}" cy="${y(v)}" r="8" fill="transparent"><title>${esc(labels[i])}: ${esc(opts.unit==='kg'?nf1.format(v)+' kg':eur.format(v))}</title></circle>`})});
  s+='</svg>';
  return `<div class="chart ${opts.unit==='kg'?'':'money'}" style="display:block"><div class="legend">${series.map(se=>`<span style="--c:${se.c}">${esc(se.n)}</span>`).join('')}${opts.ref!=null?`<span style="--c:var(--bad)">${esc(opts.refLabel||'Grenze')}</span>`:''}</div>${s}</div>`;
}

const toMin=t=>{if(!t)return null;const [h,m]=String(t).split(':').map(Number);return h*60+(m||0)};
const fromMin=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
function dayPlan(d){
  const its=[];const wo=woFor(d);
  S.events.forEach(e=>{if(occDates(e,d,d).length)its.push({kind:'ev',occ:e.repeat?d:null,title:e.title,sub:[e.place,e.calendar].filter(Boolean).join(' · '),s:toMin(e.time),e:toMin(e.end)||(e.time?toMin(e.time)+60:null),buf:+e.buffer||0,src:evSrc(e),coll:'events',id:e.id})});
  S.hhCal.forEach(e=>{if(occDates(e,d,d).length)its.push({kind:'ev',title:e.title,sub:'Gemeinsam',s:toMin(e.time),e:e.time?toMin(e.time)+60:null,buf:0,src:'gemeinsam',coll:'hhCal',id:e.id})});
  S.reminders.filter(r=>r.status!=='erledigt'&&r.due&&(r.due===d||(d===TODAY()&&r.due<d))&&(!r.waitingFor||(r.followUp&&r.followUp<=d))).forEach(r=>its.push({kind:'todo',title:r.title,s:toMin(r.time),e:r.time?toMin(r.time)+(+r.dur||30):null,src:'todo',coll:'reminders',id:r.id,r}));
  if(owner&&d===TODAY())contactDue().slice(0,3).forEach(x=>its.push({kind:'person',title:'Melde dich: '+x.p.name,src:'geburtstage',coll:'people',id:x.p.id,s:null}));
  if(owner&&wo.items.length){const st=toMin((S.settings&&S.settings.trainTime)||'18:00');its.push({kind:'wo',title:'Training · '+(wo.focus||''),s:st,e:st+75,src:'training',wo:d})}

function cashBars(ks,data){

function planActual(k,ent){
  const inEnt=e=>ent==='Alle'||(e||'Privat')===ent;const used=new Set();
  const tx=TX().filter(x=>(x.date||'').startsWith(k)&&x.category!=='Umbuchung'&&inEnt(x.entity));
  const rows=S.plan.filter(p=>inEnt(p.entity)&&occurs(p.start||'2000-01-01',p.end,p.interval||'monatlich',k)).map(p=>{const sign=p.kind==='Einnahme'?1:-1;const soll=sign*Math.abs(+p.amount||0);const kw=String(p.title||'').toLowerCase().split(/\s+/).filter(w=>w.length>=4);
    const m=tx.filter(x=>{const key=x.id+'|'+(x._split??'');if(used.has(key)||Math.sign(+x.amount)!==sign)return false;const hit=x.planId===p.id||(p.category&&x.category===p.category)||kw.some(w=>String((x.counterparty||'')+' '+(x.purpose||'')).toLowerCase().includes(w));if(hit)used.add(key);return hit});
    return {t:p.title,id:p.id,soll,ist:sum(m,x=>x.amount),n:m.length}});
  const rest=tx.filter(x=>!used.has(x.id+'|'+(x._split??'')));
  const unIn=sum(rest.filter(x=>+x.amount>0),x=>x.amount),unOut=sum(rest.filter(x=>+x.amount<0),x=>x.amount);
  return {rows,unIn,unOut,soll:sum(rows,r=>r.soll),ist:sum(tx,x=>x.amount)};
}

const DEPT_RULES=[[/apfel|äpfel|banane|tomate|gurke|salat|zwiebel|kartoffel|paprika|avocado|zitrone|limette|beere|obst|gemüse|karotte|möhre|knoblauch|ingwer|spinat|brokkoli|zucchini|pilz|champignon|kräuter|basilikum|petersilie|birne|traube|orange|mango/i,'Obst & Gemüse'],[/milch|joghurt|käse|butter|quark|sahne|\beier?\b|skyr|wurst|schinken|tofu|hähnchen|huhn|fleisch|hack|lachs|fisch|mozzarella|feta|parmesan/i,'Kühlregal'],[/brot|brötchen|toast|baguette|croissant|wrap|tortilla/i,'Brot'],[/nudel|pasta|spaghetti|reis|mehl|zucker|\böl\b|olivenöl|essig|dose|konserve|müsli|haferflocken|kaffee|\btee\b|gewürz|salz|pfeffer|honig|marmelade|sauce|soße|linsen|bohnen|kichererbsen|nüsse|mandeln|schokolade|chips|riegel/i,'Vorrat'],[/wasser|saft|bier|wein|cola|limo|sprudel|sekt|mate/i,'Getränke'],[/zahnpasta|zahnbürste|shampoo|duschgel|deo|seife|toilettenpapier|klopapier|taschentücher|creme|rasier|watte|pflaster/i,'Drogerie'],[/spülmittel|waschmittel|müllbeutel|schwamm|reiniger|alufolie|frischhaltefolie|backpapier|küchenrolle|tabs|spülmaschine|weichspüler|kerze|batterie/i,'Haushalt']];
const SHOP_ORDER=['Obst & Gemüse','Brot','Kühlregal','Vorrat','Getränke','Drogerie','Haushalt','Sonstiges'];
const shopKey=x=>String(x||'').toLowerCase().trim().replace(/\s+/g,' ').replace(/[.#$\/\[\]]/g,'');
function shopHist(){return (S.hh&&S.hh.shopHistory)||{}}
function deptOf(name){const h=shopHist()[shopKey(name)];if(h&&h.cat)return h.cat;for(const [re,c] of DEPT_RULES)if(re.test(name))return c;return 'Sonstiges'}
async function shopLearn(names,cat){if(!db)return;const h={...shopHist()};names.forEach(n=>{const k=shopKey(n);if(!k)return;const o=h[k]||{n:0};h[k]={name:o.name||n,n:(o.n||0)+(cat?0:1),cat:cat||o.cat||deptOf(n),last:TODAY()}});try{await db.doc('hh/main').set({...S.hh,shopHistory:h})}catch(e){}}
function recNext(r){if(!r.start)return null;const st=IV_M[r.interval||'monatlich']||1;let d=r.start,g=0;while(d<=TODAY()&&g<400){g++;d=addMonths(r.start,st*g)}return r.until&&d>r.until?null:d}
let hhGenBusy=false,hhGenDone=false;
async function hhGenerate(){if(hhGenBusy||!db)return;hhGenBusy=true;let n=0;
  try{const t=TODAY();const have=new Set(S.hhExp.map(e=>e.id));

function exHist(name,before){const out={last:null,best:0};const ws=[...S.workouts].filter(w=>w.date<before).sort((a,b)=>a.date<b.date?1:-1);
  for(const w of ws){const e=Object.entries(w.ex||{}).find(([k,v])=>(v.swap||k)===name);if(!e)continue;const sets=(e[1].sets||[]).filter(x=>x&&(x.r!=null||x.kg!=null));if(!sets.length)continue;if(!out.last)out.last={date:w.date,sets};sets.forEach(x=>{if(+x.kg>out.best)out.best=+x.kg})}
  return out}
function weekVolume(n=6){const wks=[];let mon=monday(TODAY());for(let i=0;i<n;i++){wks.unshift(mon);mon=addDays(mon,-7)}const tagOf={};libList().forEach(x=>tagOf[x.n]=x.tags||[]);const rows={};const tot=[];const rpe=[];
  wks.forEach((m,wi)=>{const ws=S.workouts.filter(w=>w.date>=m&&w.date<=addDays(m,6));let t=0;const rp=[];ws.forEach(w=>{if(w.rpe)rp.push(+w.rpe);Object.entries(w.ex||{}).forEach(([k,e])=>{const nm=e.swap||k;const sets=(e.sets||[]).filter(s2=>s2&&(s2.r!=null||s2.kg!=null)).length;if(!sets)return;t+=sets;(tagOf[nm]&&tagOf[nm].length?tagOf[nm]:['ohne Tag']).forEach(g=>{rows[g]=rows[g]||Array(n).fill(0);rows[g][wi]+=sets})})});tot.push(t);rpe.push(rp.length?sum(rp,x=>x)/rp.length:null)});
  const prev=tot.slice(-4,-1).filter(x=>x>0);const base=prev.length?sum(prev,x=>x)/prev.length:0;const cur=tot[tot.length-1];const rising=tot.slice(-4).every((x,i,a)=>i===0||x>=a[i-1])&&tot.slice(-4).every(x=>x>0);const hiRpe=rpe.slice(-2).filter(x=>x!=null).some(x=>x>=8.5);
  const deload=(base&&cur>base*1.3)||(rising&&hiRpe)||tot.slice(-5).every(x=>x>0)&&tot.slice(-5).length===5&&hiRpe;
  return {wks,rows,tot,rpe,deload}}
function throwStats(){return [...S.workouts].sort((a,b)=>a.date<b.date?-1:1).map(w=>{let th=0,hi=0;Object.values(w.ex||{}).forEach(e=>(e.sets||[]).forEach(s2=>{if(s2&&s2.hit!=null){th+=+s2.r||0;hi+=+s2.hit||0}}));return th?{date:w.date,th,hi,q:hi/th*100}:null}).filter(Boolean)}

V.projekte=()=>{
  const ord={aktiv:0,wartet:1,Idee:2,erledigt:3};const wk=weekId(new Date());const ps=[...S.projects].sort((a,b)=>((b.focusWeek===wk)-(a.focusWeek===wk))||((ord[a.status]??1)-(ord[b.status]??1)));
  const card=p=>{const pr=projProgress(p);const nm=nextMilestone(p);const lt=linkedTodos('projects',p.id).length;const foc=p.focusWeek===wk;
    return `<div class="card ${foc?'focus':''}" tabindex="0" data-edit="projects" data-id="${esc(p.id)}"><div class="panel-h" style="min-height:0"><h3>${esc(p.title)}</h3><div class="tools"><button class="star" data-focus="${esc(p.id)}" aria-pressed="${foc}" aria-label="${foc?'Aus Wochenfokus entfernen':'In den Wochenfokus'}" title="Wochenfokus">${foc?'★':'☆'}</button><span class="pill ${p.status==='aktiv'?'acc':p.status==='erledigt'?'good':p.status==='wartet'?'warn':''}">${esc(p.status||'')}</span></div></div>
    <div class="sync">${esc(p.area||'')}${p.due?` · Ziel ${fd(p.due)}`:''}${lt?` · ${lt} offene To-Dos`:''}</div>${p.nextStep?`<div>${esc(p.nextStep)}</div>`:''}
    ${nm?`<div class="ms"><span class="pill ${nm.date&&days(nm.date)<0?'bad':nm.date&&days(nm.date)<=7?'warn':''}">◆ ${esc(nm.t)}${nm.date?' · '+fds(nm.date):''}</span></div>`:''}
    ${pr!=null?`<div class="prog" title="${pr} %"><i style="width:${pr}%"></i></div><div class="sync">${(p.milestones||[]).length?`${p.milestones.filter(m=>m.done).length} von ${p.milestones.length} Meilensteinen`:pr+' %'}</div>`:''}</div>`};
  const gl=S.goals.map(g=>{const cur=goalValue(g);const tg=+g.target||0;const inv=g.auto==='debt';const pc=tg?Math.max(0,Math.min(100,inv?(cur<=tg?100:tg/cur*100):cur/tg*100)):0;const isEur=['net','liq','debt'].includes(g.auto);const fmt=v=>isEur?eur.format(v):nf1.format(v);
    let pace='';if(g.due&&tg&&!inv&&pc<100){const left=days(g.due);if(left>0)pace=` · noch ${left} Tage`}
    return rowHTML({coll:'goals',id:g.id,t:g.title,s:`${esc([g.horizon,g.area,g.auto?GOAL_AUTO[g.auto][0]+' · automatisch':g.metric].filter(Boolean).join(' · '))}${pace}<div class="prog" style="margin-top:6px;max-width:320px"><i style="width:${pc}%"></i></div>`,r:tg?`<span class="num ${isEur?'money':''}">${fmt(cur)} / ${fmt(tg)}</span>`:'',rs:tg?`${Math.round(pc)} %`:'',tone:pc>=100?'good':'acc'})});
  return `<div class="topbar"><div><h1>Projekte & Ziele</h1><p>Was läuft, was als Nächstes ansteht, und woran du dich misst. ☆ setzt ein Projekt in den Wochenfokus – es erscheint dann unter „Heute“.</p></div></div>
  ${panel('Projekte',ps.length?`<div class="cards">${ps.map(card).join('')}</div>`:'<div class="empty">Noch keine Projekte.</div>','projects')}
  ${panel('Ziele',S.goals.length?`<div class="list">${gl.join('')}</div>`:'<div class="empty">Noch keine Ziele. Ziele wie „Nettovermögen“ oder „Trainingseinheiten pro Woche“ messen sich automatisch.</div>','goals')}`;
};
V.persoenlich=()=>{

    const ms=[];for(let i=0;i>-12;i--)ms.push(monthKey(i));const mk=ms.includes(ui.tab.habMonth)?ui.tab.habMonth:ms[0];

  } else if(tb.cur==='ernaehrung'){

    const freq={};S.meals.filter(m=>m.what&&days(m.date)>=-90).forEach(m=>{const k=m.what.trim().toLowerCase();const o=freq[k]=freq[k]||{what:m.what.trim(),n:0,kcal:0,protein:0,meal:m.meal,fav:false};o.n++;o.kcal+=+m.kcal||0;o.protein+=+m.protein||0;if(m.fav==='ja')o.fav=true});

    <div class="grid2">${panel('Heute gegessen',listHTML(today.map(m=>rowHTML({coll:'meals',id:m.id,t:(m.fav==='ja'?'★ ':'')+m.what,s:esc(m.meal||''),r:m.kcal?`<span class="num">${nf.format(m.kcal)} kcal</span>`:'',rs:m.protein?`${nf.format(m.protein)} g Protein`:''})),'Heute noch nichts erfasst.'),'meals')}

function periodStats(from,to){
  const inP=d=>d&&d>=from&&d<=to;const tx=TX().filter(x=>inP(x.date)&&x.category!=='Umbuchung'&&(x.entity||'Privat')==='Privat');const inc=sum(tx.filter(x=>+x.amount>0),x=>x.amount),out=Math.abs(sum(tx.filter(x=>+x.amount<0),x=>x.amount));
  const cats={};tx.filter(x=>+x.amount<0).forEach(x=>{cats[x.category||'Sonstiges']=(cats[x.category||'Sonstiges']||0)+Math.abs(+x.amount)});
  const wo=S.workouts.filter(w=>inP(w.date));const jr=S.journal.filter(j=>inP(j.id));const moods=jr.filter(j=>j.mood).map(j=>+j.mood);
  const todos=S.reminders.filter(r=>r.status==='erledigt'&&inP(r.doneAt));const mails=S.mails.filter(m=>m.status==='erledigt'&&inP((m.updatedAt||'').slice(0,10)));
  const hs=S.habits.filter(h=>h.active!=='nein');let hDone=0,hExp=0;const dd=[];for(let d=from;d<=to&&d<=TODAY();d=addDays(d,1))dd.push(d);hs.forEach(h=>{const pw=perWeekOf(h);hDone+=dd.filter(d=>hState(h.id,d)==='done').length;hExp+=pw?Math.round(dd.length/7*pw):dd.length});
  const snaps=S.snapshots.filter(s=>s.month>=from.slice(0,7)&&s.month<=to.slice(0,7));const netD=snaps.length>=2?snaps[snaps.length-1].net-snaps[0].net:null;

  const trips=S.trips.filter(t=>t.from&&t.from<=to&&(t.to||t.from)>=from);
  return {inc,out,rate:inc?(inc-out)/inc*100:null,cats:Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6),wo:wo.length,jr:jr.length,mood:moods.length?sum(moods,x=>x)/moods.length:null,todos:todos.length,mails:mails.length,hPct:hExp?Math.round(hDone/hExp*100):null,netD,projDone,ms,trips,wkg:sum(wo,w=>Object.values(w.ex||{}).reduce((t,e)=>t+(e.sets||[]).reduce((a,s2)=>a+(+s2.kg||0)*(+s2.r||0),0),0))}
}

function skontoInfo(i){if(!i.skontoPct||!i.skontoDate||i.skontoDate<TODAY())return null;const amt=Math.abs(+i.amount||0);const save=Math.round(amt*(+i.skontoPct)/100*100)/100;return {save,pay:Math.round((amt-save)*100)/100}}
const payBy=i=>{const sk=skontoInfo(i);return sk?i.skontoDate:(i.due||TODAY())};
// ---------- Buchungen: Aufteilung, Umbuchungen, Regeln ----------
let _txSrc=null,_txOut=[];
function txParts(x){const sp=Array.isArray(x.splits)?x.splits.filter(p=>p&&p.amount!=null&&p.amount!==''&&!isNaN(+p.amount)):[];if(!sp.length)return [x];const tot=sum(sp,p=>p.amount);const rest=Math.round(((+x.amount)-tot)*100)/100;const parts=sp.map((p,i)=>({...x,amount:+p.amount,entity:p.entity||x.entity,category:p.category||x.category,taxTag:p.taxTag||x.taxTag,_split:i,_parent:x.id}));if(Math.abs(rest)>=0.01)parts.push({...x,amount:rest,_split:'rest',_parent:x.id});return parts}
function TX(){if(_txSrc===S.transactions)return _txOut;_txSrc=S.transactions;_txOut=S.transactions.flatMap(txParts);return _txOut}
function detectTransfers(list){list=list||S.transactions;const own=new Set(S.accounts.map(a=>a.name));const cand=list.filter(x=>x.category!=='Umbuchung'&&!x.transferId&&own.has(x.account));const out=[];const used=new Set();
  cand.filter(a=>+a.amount<0).forEach(a=>{if(used.has(a.id))return;const b=cand.find(y=>!used.has(y.id)&&+y.amount>0&&Math.abs(+y.amount+ +a.amount)<0.01&&y.account!==a.account&&Math.abs((parseD(y.date)-parseD(a.date))/864e5)<=3);if(b){used.add(a.id);used.add(b.id);out.push([a,b])}});return out}
async function markTransfers(pairs,quiet){const before=pairs.flat().map(clone);for(const [a,b] of pairs){const tid='tr-'+String(a.id).slice(-6)+String(b.id).slice(-6);await patch('transactions',a.id,{category:'Umbuchung',transferId:tid,catManual:true});await patch('transactions',b.id,{category:'Umbuchung',transferId:tid,catManual:true})}if(!quiet)undoToast(`${pairs.length} Umbuchungen markiert`,async()=>{for(const b of before)await restoreDoc('transactions',b)})}
function ruleMatch(r,x){if(!r.cond)return !!r.key&&catKey(x.counterparty)===r.key;const k=String(r.key||'').toLowerCase().trim();if(!k)return false;const hay=r.field==='purpose'?x.purpose:r.field==='counterparty'?x.counterparty:[x.counterparty,x.purpose].join(' ');if(!String(hay||'').toLowerCase().includes(k))return false;const a=Math.abs(+x.amount||0);if(r.dir==='out'&&+x.amount>=0)return false;if(r.dir==='in'&&+x.amount<0)return false;if(r.min!=null&&r.min!==''&&a<+r.min)return false;if(r.max!=null&&r.max!==''&&a>+r.max)return false;return true}
function applyRules(x){const rs=[...S.catrules].sort((a,b)=>(b.cond?1:0)-(a.cond?1:0));const out={};for(const r of rs){if(ruleMatch(r,x)){if(r.category&&!out.category)out.category=r.category;if(r.entity&&!out.entity)out.entity=r.entity;if(r.taxTag&&!out.taxTag)out.taxTag=r.taxTag}}return out}
async function applyRulesToAll(){let n=0;for(const x of S.transactions){if(x.catManual)continue;const ap=applyRules(x);const p={};['category','entity','taxTag'].forEach(k=>{if(ap[k]&&x[k]!==ap[k])p[k]=ap[k]});if(Object.keys(p).length){await patch('transactions',x.id,p);n++}}toast(n?`${n} Buchungen angepasst`:'Keine Änderungen nötig')}

async function uploadFile(file){if(!assetsApi)throw new Error('Hochladen nicht verfügbar');return await assetsApi.upload(file)}
function matchTx(inv){
  const amt=Math.abs(+inv.amount||0);if(!amt)return null;const sign=inv.kind==='Gutschrift'?1:-1;
  const iss=String(inv.issuer||inv.title||'').toLowerCase().split(/\s+/).filter(w=>w.length>3)[0]||'';
  const ref=inv.due||TODAY();
  const c=S.transactions.filter(x=>!x.invoiceId&&Math.sign(+x.amount)===sign&&Math.abs(Math.abs(+x.amount)-amt)<=Math.max(0.5,amt*0.005)&&Math.abs((parseD(x.date)-parseD(ref))/864e5)<=45);
  c.sort((a,b)=>{const ia=iss&&String(a.counterparty||'').toLowerCase().includes(iss)?0:1,ib=iss&&String(b.counterparty||'').toLowerCase().includes(iss)?0:1;return ia-ib||Math.abs(parseD(a.date)-parseD(ref))-Math.abs(parseD(b.date)-parseD(ref))});
  return c[0]||null;
}

function splitCSV(text){
  const lines=text.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());const head=lines.slice(0,15).join('\n');
  const delim=head.split(';').length>head.split(',').length?';':',';
  const parse=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===delim&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(s=>s.trim())};
  return lines.map(parse);
}
const norm=s=>s.toLowerCase().replace(/[^a-zäöüß/ ]/g,'').trim();
function findCol(h,names){for(const n of names){const i=h.findIndex(x=>norm(x)===n);if(i>=0)return i}for(const n of names){const i=h.findIndex(x=>norm(x).includes(n));if(i>=0)return i}return -1}
function pAmount(s){if(s==null)return NaN;s=String(s).replace(/[−–]/g,'-').replace(/[€\sA-Za-z]/g,'');const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');if(lc>ld)s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');return parseFloat(s)}
function pDate(s){s=String(s||'').trim();let m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${pad(m[2])}-${pad(m[1])}`}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;return null}
function guessCat(t,cp){const r=cp!=null&&ruleCat(cp);if(r)return r;for(const [re,c] of CAT_RULES)if(re.test(t))return c;return 'Sonstiges'}
function guessTax(ent,amt){if(ent==='Stockkampstraße')return 'Anlage V Stockkampstraße';if(ent==='JPL Capital UG')return amt>0?'Betriebseinnahme':'Betriebsausgabe JPL Capital UG';if(ent==='Lestate Real')return amt>0?'Betriebseinnahme':'Betriebsausgabe Lestate';return null}
function hashId(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return 'tx'+(h>>>0).toString(36)}

function parseReceiptText(txt){
  const lines=String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean);const amts=[];
  lines.forEach((l,i)=>{const key=/summe|gesamt|total|zu zahlen|endbetrag|rechnungsbetrag|brutto/i.test(l);const re=/(\d{1,3}(?:[.\s]\d{3})*,\d{2}|\d+[.,]\d{2})(?!\d)/g;let m;while((m=re.exec(l))){const v=pAmount(m[1]);if(!isNaN(v)&&v>0&&v<1e6)amts.push({v,key})}});
  const keyed=amts.filter(a=>a.key).sort((a,b)=>b.v-a.v);const pick=keyed[0]||[...amts].sort((a,b)=>b.v-a.v)[0];
  const dt=m=>{if(!m)return null;const y=m[3].length===2?'20'+m[3]:m[3];const d=`${y}-${pad(m[2])}-${pad(m[1])}`;const p=parseD(d);return p&&!isNaN(p)&&+m[2]<=12&&+m[1]<=31?d:null};
  const due=dt(String(txt).match(/(?:fällig|zahlbar bis|zahlungsziel|bis zum)[^\d]{0,20}(\d{1,2})\.(\d{1,2})\.(\d{2,4})/i));
  const date=dt(String(txt).match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{4}|\d{2})(?!\d)/));
  const vendor=((lines.find(l=>/[A-Za-zÄÖÜäöüß]{3,}/.test(l)&&!/rechnung|beleg|quittung|kassenbon|bon|datum|seite/i.test(l))||'').replace(/[^\wÄÖÜäöüß&.\- ]/g,' ').replace(/\s+/g,' ').trim().slice(0,40))||null;
  const invoiceNo=(String(txt).match(/rechnungs?\s*-?\s*(?:nr|nummer)\.?\s*:?\s*([A-Z0-9][A-Z0-9\-\/]{2,})/i)||[])[1]||null;
  return {date,due,amount:pick?pick.v:null,vendor,invoiceNo,title:null,category:vendor?ruleCat(vendor):null};
}
